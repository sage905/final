---
- name: Ensure mysql group exists
  ansible.builtin.group:
    name: "{{ mysql_group }}"
    state: present

- name: Add admin users to the mysql group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ mysql_group }}"
    append: true
  loop: "{{ mysql_group_members }}"
  when: mysql_group_members | length > 0

# Top-level dir is Ansible-managed: compose, server config, and the secrets
# subdir live here with the mysql group as owner so admins can SFTP-edit.
- name: Create the mysql top-level directory
  ansible.builtin.file:
    path: "{{ mysql_data_dir }}"
    state: directory
    owner: "{{ mysql_user }}"
    group: "{{ mysql_group }}"
    mode: "2775"

# Secrets dir is tighter — group-readable but not group-writable.
- name: Create the mysql secrets directory
  ansible.builtin.file:
    path: "{{ mysql_data_dir }}/secrets"
    state: directory
    owner: "{{ mysql_user }}"
    group: "{{ mysql_group }}"
    mode: "0750"

# Runtime data bind mount. The MariaDB image runs as the `mysql` user
# (mysql_container_uid) and writes its data files here, so the dir must be
# owned by that UID — a root-owned bind mount makes the entrypoint fail with
# "Permission denied". Owner is asserted every run (not first-run-gated) so a
# previously root-owned dir self-heals.
- name: Ensure the mysql data dir is owned by the container user
  ansible.builtin.file:
    path: "{{ mysql_data_dir }}/data"
    state: directory
    owner: "{{ mysql_container_uid }}"
    group: "{{ mysql_group }}"
    mode: "0770"

- name: Generate persistent secrets when not supplied
  ansible.builtin.include_tasks: _generate_secret.yml
  loop:
    - name: root_password
      override: "{{ mysql_root_password }}"
      length: 24
    - name: panel_password
      override: "{{ mysql_panel_password }}"
      length: 24
  loop_control:
    loop_var: secret

# Secrets live on the target host (not the controller), so use `slurp`.
- name: Slurp generated secrets from the host
  ansible.builtin.slurp:
    src: "{{ mysql_data_dir }}/secrets/{{ item }}"
  loop:
    - root_password
    - panel_password
  register: mysql_secret_slurp
  no_log: true

- name: Resolve effective secrets
  ansible.builtin.set_fact:
    mysql_effective_root_password: "{{ mysql_root_password
                                       if mysql_root_password | length > 0
                                       else mysql_secret_slurp.results[0].content | b64decode | trim }}"
    mysql_effective_panel_password: "{{ mysql_panel_password
                                        if mysql_panel_password | length > 0
                                        else mysql_secret_slurp.results[1].content | b64decode | trim }}"
  no_log: true

- name: Render the MariaDB server config
  ansible.builtin.template:
    src: mysql.cnf.j2
    dest: "{{ mysql_data_dir }}/mysql.cnf"
    owner: "{{ mysql_user }}"
    group: "{{ mysql_group }}"
    mode: "0664"
  notify: Recreate mysql stack

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mysql_data_dir }}/docker-compose.yml"
    owner: "{{ mysql_user }}"
    group: "{{ mysql_group }}"
    mode: "0660"
  notify: Recreate mysql stack
