---
- name: Ensure the shared Docker network exists
  ansible.builtin.command:
    cmd: "docker network create {{ mysql_shared_network }}"
  register: mysql_network_result
  changed_when: mysql_network_result.rc == 0
  failed_when:
    - mysql_network_result.rc != 0
    - "'already exists' not in mysql_network_result.stderr"

# Pull explicitly first so download progress is visible in the play log
# rather than hidden inside `compose up`.
- name: Pull the stack images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ mysql_data_dir }}"
  register: mysql_pull_result
  changed_when: >-
    'Trying to pull' in mysql_pull_result.stdout
    or 'Pulling' in mysql_pull_result.stderr
    or 'Writing manifest' in mysql_pull_result.stderr
  timeout: 1800

- name: Bring the mysql stack up
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ mysql_data_dir }}"
  register: mysql_compose_result
  changed_when: "'Creating' in mysql_compose_result.stdout
                 or 'Recreating' in mysql_compose_result.stdout
                 or 'Started' in mysql_compose_result.stderr"
  timeout: 300

- name: Provision the panel management user
  block:
    # First boot initialises the data directory and runs migrations, during
    # which the server is not yet accepting queries. Poll until a trivial
    # query succeeds (up to 5 min).
    # `docker exec` does NOT forward the host's environment into the container,
    # so MYSQL_PWD must be passed through explicitly with `-e MYSQL_PWD` (no
    # value = take it from the CLI env set by the `environment:` keyword below).
    # Without this the in-container mariadb client gets no password and the
    # probe loops until timeout even though the server is up.
    - name: Wait for MariaDB to accept queries
      ansible.builtin.command:
        cmd: >-
          docker exec -e MYSQL_PWD {{ mysql_container_name }}
          mariadb -uroot -e "SELECT 1"
      environment:
        MYSQL_PWD: "{{ mysql_effective_root_password }}"
      register: mysql_ready
      retries: 30
      delay: 10
      until: mysql_ready.rc == 0
      changed_when: false
      no_log: true

    # The MariaDB image only auto-creates accounts on first init via env vars,
    # and those get privileges on a single database — not the global GRANT
    # OPTION the panel needs to provision per-game-server databases. So create
    # the management user here. Gated on existence so reruns report no change;
    # the password is generate-once and persisted, so it never drifts.
    - name: Check whether the panel management user exists
      ansible.builtin.command:
        cmd: >-
          docker exec -e MYSQL_PWD {{ mysql_container_name }}
          mariadb -uroot -N -B -e
          "SELECT COUNT(*) FROM mysql.user
           WHERE user = '{{ mysql_panel_user }}'
             AND host = '{{ mysql_panel_user_host }}'"
      environment:
        MYSQL_PWD: "{{ mysql_effective_root_password }}"
      register: mysql_panel_user_check
      changed_when: false
      no_log: true

    - name: Create the panel management user with global grant option
      ansible.builtin.command:
        cmd: "docker exec -i -e MYSQL_PWD {{ mysql_container_name }} mariadb -uroot"
        stdin: >-
          CREATE USER '{{ mysql_panel_user }}'@'{{ mysql_panel_user_host }}'
          IDENTIFIED BY '{{ mysql_effective_panel_password }}';
          GRANT ALL PRIVILEGES ON *.*
          TO '{{ mysql_panel_user }}'@'{{ mysql_panel_user_host }}'
          WITH GRANT OPTION;
          FLUSH PRIVILEGES;
      environment:
        MYSQL_PWD: "{{ mysql_effective_root_password }}"
      when: mysql_panel_user_check.stdout | trim | int == 0
      changed_when: true
      no_log: true
  rescue:
    - name: Dump database container logs for diagnosis
      ansible.builtin.command:
        cmd: docker logs --tail 100 {{ mysql_container_name }}
      register: mysql_logs
      changed_when: false
      failed_when: false
    - name: Show the last 100 lines of database logs
      ansible.builtin.debug:
        msg: "{{ mysql_logs.stdout_lines }}"
    - name: Fail after dumping logs
      ansible.builtin.fail:
        msg: >-
          MariaDB never became ready or the panel user could not be
          provisioned. Inspect the logs printed above.

- name: Show the connection hint
  ansible.builtin.debug:
    msg: >-
      MySQL (MariaDB) is up on {{ mysql_published_address }}:{{ mysql_published_port }}.
      In the panel, add a Database Host with user '{{ mysql_panel_user }}'
      (password in {{ mysql_data_dir }}/secrets/panel_password) — the panel
      then creates a database per game server on demand.
      {{ 'Adminer UI runs at ' ~ mysql_adminer_container_name ~ ':'
         ~ mysql_adminer_container_port ~ ' (front it with a caddy_sites entry).'
         if mysql_adminer_enabled else '' }}
