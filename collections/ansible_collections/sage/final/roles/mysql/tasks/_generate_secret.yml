---
# Generate-once secret helper. Called per-item from install.yml with:
#   secret.name     — filename under {{ mysql_data_dir }}/secrets/
#   secret.override — caller-supplied value; if non-empty, skip generation
#   secret.length   — random byte length passed to `openssl rand -base64`
- name: "Check whether secret {{ secret.name }} already exists"
  ansible.builtin.stat:
    path: "{{ mysql_data_dir }}/secrets/{{ secret.name }}"
  register: mysql_secret_stat

- name: "Generate secret {{ secret.name }}"
  when:
    - not mysql_secret_stat.stat.exists
    - secret.override | length == 0
  block:
    - name: "Generate {{ secret.length }} random bytes for {{ secret.name }}"
      ansible.builtin.command:
        cmd: "openssl rand -base64 {{ secret.length }}"
      register: mysql_secret_value
      changed_when: true

    # Strip characters that would need shell/SQL quoting in the connection
    # string the panel hands to game servers (keeps copy-paste painless).
    - name: "Persist secret {{ secret.name }}"
      ansible.builtin.copy:
        content: "{{ mysql_secret_value.stdout | regex_replace('[^A-Za-z0-9]', '') }}\n"
        dest: "{{ mysql_data_dir }}/secrets/{{ secret.name }}"
        owner: "{{ mysql_user }}"
        group: "{{ mysql_group }}"
        mode: "0640"
      no_log: true
