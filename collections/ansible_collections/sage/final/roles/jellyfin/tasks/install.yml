---
- name: Ensure Jellyfin group exists
  ansible.builtin.group:
    name: "{{ jellyfin_group }}"
    state: present

- name: Add admin users to the Jellyfin group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ jellyfin_group }}"
    append: true
  loop: "{{ jellyfin_group_members }}"
  when: jellyfin_group_members | length > 0

- name: Create the Jellyfin data directory
  ansible.builtin.file:
    path: "{{ jellyfin_data_dir }}"
    state: directory
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_group }}"
    mode: "2775"

# config/ and cache/ are written by the container, which runs as
# jellyfin_run_uid:jellyfin_run_gid — so they must be owned by that user. The
# recurse heals ownership left over from when Jellyfin ran as root (or from
# prior rootless runs) so the non-root process can read/write its state.
- name: Create and normalize Jellyfin runtime dirs (owned by the run user)
  ansible.builtin.file:
    path: "{{ jellyfin_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ jellyfin_run_uid }}"
    group: "{{ jellyfin_run_gid }}"
    mode: "u=rwX,g=rwX,o="
    recurse: true
  loop:
    - config
    - cache

# The media library (jellyfin_media_path) is owned by sage.final.disk_pool —
# the single source of truth for media-tree ownership and permissions — so this
# role no longer creates or chowns it.

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyfin_data_dir }}/docker-compose.yml"
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_group }}"
    mode: "0660"
  notify: Recreate jellyfin stack
