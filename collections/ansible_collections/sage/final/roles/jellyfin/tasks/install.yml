---
- name: Ensure Jellyfin group exists
  ansible.builtin.group:
    name: "{{ jellyfin_group }}"
    state: present

- name: Add admin users to the Jellyfin group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ jellyfin_group }}"
    append: true
  loop: "{{ jellyfin_group_members }}"
  when: jellyfin_group_members | length > 0

- name: Create Jellyfin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_group }}"
    mode: "2775"
  loop:
    - "{{ jellyfin_data_dir }}"
    - "{{ jellyfin_data_dir }}/config"
    - "{{ jellyfin_data_dir }}/cache"

# Heal ownership left over from prior rootless runs (subuid-mapped UIDs)
# back to the rootful owner+group with setgid + group-write.
- name: Normalize ownership of runtime dirs (heals prior-run leftovers)
  ansible.builtin.file:
    path: "{{ jellyfin_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_group }}"
    mode: "u=rwX,g=rwX,o="
    recurse: true
  loop:
    - config
    - cache

- name: Ensure the media directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_media_path }}"
    state: directory
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_group }}"
    mode: "2775"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyfin_data_dir }}/docker-compose.yml"
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_group }}"
    mode: "0660"
  notify: Recreate jellyfin stack
