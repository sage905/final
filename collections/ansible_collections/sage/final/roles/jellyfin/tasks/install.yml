---
- name: Ensure Jellyfin group exists
  ansible.builtin.group:
    name: "{{ jellyfin_group }}"
    state: present

- name: Add users to the Jellyfin group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ jellyfin_group }}"
    append: true
  loop: "{{ ([jellyfin_user] + jellyfin_group_members) | unique }}"

- name: Create Jellyfin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_group }}"
    mode: "2775"
  loop:
    - "{{ jellyfin_data_dir }}"
    - "{{ jellyfin_data_dir }}/config"
    - "{{ jellyfin_data_dir }}/cache"

# `:U` on the compose mounts only chowns files within podman's subuid range.
# Files left behind by a prior root or rootful run can be outside that range
# and trigger "lchown: operation not permitted" on container start. Run a
# pre-emptive recursive chown as root to normalize ownership.
- name: Normalize ownership of runtime dirs (heals prior-run leftovers)
  ansible.builtin.file:
    path: "{{ jellyfin_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_group }}"
    mode: "u=rwX,g=rwX,o="
    recurse: true
  loop:
    - config
    - cache

- name: Ensure the media directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_media_path }}"
    state: directory
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_group }}"
    mode: "2775"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyfin_data_dir }}/docker-compose.yml"
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_group }}"
    mode: "0660"
  notify: Recreate jellyfin stack
