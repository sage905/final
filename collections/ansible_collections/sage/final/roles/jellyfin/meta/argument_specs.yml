---
argument_specs:
  main:
    short_description: Deploy Jellyfin behind the shared Caddy.
    options:
      jellyfin_data_dir:
        type: path
        default: /srv/jellyfin
      jellyfin_fqdn:
        type: str
        required: true
      jellyfin_image:
        type: str
        default: docker.io/jellyfin/jellyfin:latest
      jellyfin_container_port:
        type: int
        default: 8096
      jellyfin_media_path:
        type: path
        default: "{{ jellyfin_data_dir }}/media"
        description: Host path mounted at /media inside the container.
      jellyfin_publish_dlna_port:
        type: bool
        default: false
        description: Whether to publish 7359/udp on the host for DLNA discovery.
      jellyfin_shared_network:
        type: str
        default: web
      jellyfin_install_docker:
        type: bool
        default: false
      jellyfin_user:
        type: str
        default: containers
      jellyfin_run_uid:
        type: int
        default: 1000
        description: >-
          UID the Jellyfin process runs as (compose `user:`). Point at the
          media library owner so library writes are not root-owned.
      jellyfin_run_gid:
        type: int
        default: 1000
        description: >-
          GID the Jellyfin process runs as. Set to the shared media group's GID
          (sage.final.disk_pool disk_pool_group).
      jellyfin_group:
        type: str
        default: jellyfin
      jellyfin_group_members:
        type: list
        elements: str
        default: []
        description: >-
          Additional system users to add to jellyfin_group. jellyfin_user
          is always a member. Listed users must already exist on the host.
