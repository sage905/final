---
jellyfin_data_dir: /srv/jellyfin
jellyfin_fqdn: ""
jellyfin_image: docker.io/jellyfin/jellyfin:latest
jellyfin_container_port: 8096

# Host paths Jellyfin reads from. `media_path` can point at an existing
# library outside {{ jellyfin_data_dir }} — typically a NAS bind-mount.
jellyfin_media_path: "{{ jellyfin_data_dir }}/media"

# Set true to expose the DLNA UDP discovery port on the host (7359/udp).
# Defaults off because most users access Jellyfin through the Caddy vhost.
jellyfin_publish_dlna_port: false

# Shared infra provided by sage.final.caddy.
jellyfin_shared_network: web

# Docker is installed once per host by the dedicated play in site.yml. Leave
# this false; set true only to install Docker from this role on a standalone run.
jellyfin_install_docker: false

# Rootful: stack runs via system Docker. jellyfin_user owns the compose file
# and the data_dir top on disk.
jellyfin_user: root

# UID:GID the Jellyfin process runs as inside the container (compose `user:`).
# Point these at the media library owner + shared media group so anything
# Jellyfin writes into the library (artwork, trickplay) is owned by that user
# and group, not root — keeping the human owner's full access intact. config/
# and cache/ are chowned to match so the non-root process can write them.
jellyfin_run_uid: 1000
jellyfin_run_gid: 1000

# Group that owns Jellyfin's files. Admins in jellyfin_group_members can
# read/write /srv/jellyfin (config, cache, media) via SFTP.
jellyfin_group: jellyfin
jellyfin_group_members: []
