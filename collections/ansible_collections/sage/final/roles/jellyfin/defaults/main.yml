---
jellyfin_data_dir: /srv/jellyfin
jellyfin_fqdn: ""
jellyfin_image: docker.io/jellyfin/jellyfin:latest
jellyfin_container_port: 8096

# Host paths Jellyfin reads from. `media_path` can point at an existing
# library outside {{ jellyfin_data_dir }} — typically a NAS bind-mount.
jellyfin_media_path: "{{ jellyfin_data_dir }}/media"

# Set true to expose the DLNA UDP discovery port on the host (7359/udp).
# Defaults off because most users access Jellyfin through the Caddy vhost.
jellyfin_publish_dlna_port: false

# Shared infra provided by sage.final.caddy.
jellyfin_shared_network: web

jellyfin_install_podman: true

# Rootless: user that owns this role's data dir and runs podman-compose.
jellyfin_user: containers

# Group that owns Jellyfin's files. jellyfin_user is always a member;
# extra names in jellyfin_group_members are also added (must already
# exist as system users).
jellyfin_group: jellyfin
jellyfin_group_members: []
