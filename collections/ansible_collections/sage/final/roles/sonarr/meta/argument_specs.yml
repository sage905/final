---
argument_specs:
  main:
    short_description: Deploy Sonarr routed through the Surfshark VPN gateway.
    options:
      sonarr_data_dir:
        type: path
        default: /srv/sonarr
      sonarr_image:
        type: str
        default: lscr.io/linuxserver/sonarr:latest
      sonarr_container_name:
        type: str
        default: sonarr
      sonarr_container_port:
        type: int
        default: 8989
        description: >-
          Web UI port. Reached via the VPN container's name and must be listed
          in the surfshark role's surfshark_input_ports.
      sonarr_vpn_container:
        type: str
        default: surfshark
        description: >-
          Name of the VPN gateway container whose network namespace Sonarr
          joins (network_mode "container:<this>").
      sonarr_puid:
        type: int
        default: 1000
        description: linuxserver.io PUID; should own the media/downloads paths.
      sonarr_pgid:
        type: int
        default: 1000
        description: >-
          linuxserver.io PGID; set to the shared media group's GID
          (sage.final.disk_pool disk_pool_group) so writes land in that group.
      sonarr_umask:
        type: str
        default: "002"
        description: >-
          linuxserver.io UMASK. 002 keeps new files group-writable for the
          shared media group.
      sonarr_timezone:
        type: str
        default: UTC
      sonarr_tv_path:
        type: path
        default: /srv/bulk/media/tv
        description: Host TV library path, mounted at /tv.
      sonarr_downloads_path:
        type: path
        default: /srv/bulk/downloads
        description: >-
          Host downloads path, mounted at /downloads. Use the same path on the
          download client so imports are hardlinks, not copies.
      sonarr_install_docker:
        type: bool
        default: false
      sonarr_user:
        type: str
        default: root
      sonarr_group:
        type: str
        default: sonarr
      sonarr_group_members:
        type: list
        elements: str
        default: []
        description: >-
          Additional system users to add to sonarr_group. Listed users must
          already exist on the host.
