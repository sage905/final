---
- name: Ensure sonarr group exists
  ansible.builtin.group:
    name: "{{ sonarr_group }}"
    state: present

- name: Add admin users to the sonarr group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ sonarr_group }}"
    append: true
  loop: "{{ sonarr_group_members }}"
  when: sonarr_group_members | length > 0

# Top-level dir holds the compose file (host-owned). /config is created and
# owned by the linuxserver PUID:PGID so the image can write through the mount.
- name: Create the sonarr top-level directory
  ansible.builtin.file:
    path: "{{ sonarr_data_dir }}"
    state: directory
    owner: "{{ sonarr_user }}"
    group: "{{ sonarr_group }}"
    mode: "2775"

- name: Create the sonarr config directory (owned by the container user)
  ansible.builtin.file:
    path: "{{ sonarr_data_dir }}/config"
    state: directory
    owner: "{{ sonarr_puid }}"
    group: "{{ sonarr_pgid }}"
    mode: "0775"

# Media + downloads dirs. Created if missing and owned by the container user so
# Sonarr can write. setgid keeps the group on new files for sharing with the
# download client / other media apps.
- name: Ensure library and downloads directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sonarr_puid }}"
    group: "{{ sonarr_pgid }}"
    mode: "2775"
  loop:
    - "{{ sonarr_tv_path }}"
    - "{{ sonarr_downloads_path }}"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ sonarr_data_dir }}/docker-compose.yml"
    owner: "{{ sonarr_user }}"
    group: "{{ sonarr_group }}"
    mode: "0660"
  notify: Recreate sonarr stack
