---
- name: Ensure sonarr group exists
  ansible.builtin.group:
    name: "{{ sonarr_group }}"
    state: present

- name: Add admin users to the sonarr group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ sonarr_group }}"
    append: true
  loop: "{{ sonarr_group_members }}"
  when: sonarr_group_members | length > 0

# Top-level dir holds the compose file (host-owned). /config is created and
# owned by the linuxserver PUID:PGID so the image can write through the mount.
- name: Create the sonarr top-level directory
  ansible.builtin.file:
    path: "{{ sonarr_data_dir }}"
    state: directory
    owner: "{{ sonarr_user }}"
    group: "{{ sonarr_group }}"
    mode: "2775"

- name: Create the sonarr config directory (owned by the container user)
  ansible.builtin.file:
    path: "{{ sonarr_data_dir }}/config"
    state: directory
    owner: "{{ sonarr_puid }}"
    group: "{{ sonarr_pgid }}"
    mode: "0775"

# The library (sonarr_tv_path) and downloads (sonarr_downloads_path) tree is
# owned by sage.final.disk_pool — the single source of truth for media-tree
# ownership and permissions — so this role no longer creates or chowns it.
# disk_pool must run before this role (it does in site.yml).

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ sonarr_data_dir }}/docker-compose.yml"
    owner: "{{ sonarr_user }}"
    group: "{{ sonarr_group }}"
    mode: "0660"
  notify: Recreate sonarr stack
