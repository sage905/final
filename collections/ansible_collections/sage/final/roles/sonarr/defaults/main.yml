---
# --- Stack location -----------------------------------------------------------
sonarr_data_dir: /srv/sonarr

# --- Image --------------------------------------------------------------------
sonarr_image: lscr.io/linuxserver/sonarr:latest
sonarr_container_name: sonarr

# Port Sonarr's web UI listens on. Because Sonarr shares the VPN container's
# network namespace, this port is reached via the VPN container's name
# (Caddy upstream "{{ sonarr_vpn_container }}:{{ sonarr_container_port }}"), and
# it must be listed in the VPN role's surfshark_input_ports.
sonarr_container_port: 8989

# --- VPN routing (the whole point) -------------------------------------------
# Name of the VPN gateway container (sage.final.surfshark) whose network
# namespace Sonarr joins. Sonarr gets NO network of its own — all its traffic
# exits through this container's VPN tunnel, or not at all (kill switch).
sonarr_vpn_container: surfshark

# --- linuxserver.io user mapping ---------------------------------------------
# The image runs as PUID:PGID and chowns /config to it. Point these at the
# owner of your media/downloads so Sonarr can read and write them.
sonarr_puid: 1000
sonarr_pgid: 1000
sonarr_timezone: UTC

# --- Library / downloads ------------------------------------------------------
# Host paths mounted into the container. Media lives under /srv/bulk (large,
# replaceable, excluded from backups) alongside the other media apps. Sonarr
# and your download client should share the SAME downloads path (identical on
# both sides) so completed-download imports are hardlinks, not slow copies.
sonarr_tv_path: /srv/bulk/media/tv
sonarr_downloads_path: /srv/bulk/downloads

# --- Container runtime install ------------------------------------------------
# Docker is installed once per host by the dedicated play in site.yml. Leave
# this false; set true only to install Docker from this role on a standalone run.
sonarr_install_docker: false

# Rootful: stack runs via system Docker. sonarr_user owns the compose file on
# disk; /config inside is owned by sonarr_puid:sonarr_pgid.
sonarr_user: root

# Group that owns the stack's files on the host. Admins in sonarr_group_members
# can read/write {{ sonarr_data_dir }} via SFTP.
sonarr_group: sonarr
sonarr_group_members: []
