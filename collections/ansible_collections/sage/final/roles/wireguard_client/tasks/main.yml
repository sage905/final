---
- name: Validate role arguments
  ansible.builtin.validate_argument_spec:
    argument_spec: >-
      {{ (lookup('ansible.builtin.file',
                 role_path ~ '/meta/argument_specs.yml')
          | from_yaml)['argument_specs']['main']['options'] }}

- name: Install WireGuard tooling
  ansible.builtin.import_tasks: install.yml

- name: Ensure /etc/wireguard exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

# Keys are generated on the target host (never on the controller). Using
# `creates:` makes both shell tasks idempotent — they no-op on every run
# after the first. umask 077 ensures the private key lands at mode 0600.
- name: Generate WireGuard private key (first run only)
  ansible.builtin.shell: "umask 077 && wg genkey > {{ wireguard_client_private_key_path }}"
  args:
    creates: "{{ wireguard_client_private_key_path }}"

- name: Derive WireGuard public key (first run only)
  ansible.builtin.shell: "wg pubkey < {{ wireguard_client_private_key_path }} > {{ wireguard_client_public_key_path }}"
  args:
    creates: "{{ wireguard_client_public_key_path }}"

- name: Read private key from host
  ansible.builtin.slurp:
    src: "{{ wireguard_client_private_key_path }}"
  register: wireguard_client_privkey_slurp
  no_log: true

- name: Read public key from host
  ansible.builtin.slurp:
    src: "{{ wireguard_client_public_key_path }}"
  register: wireguard_client_pubkey_slurp

# Surfacing the pubkey here lets you paste it straight into the OPNsense
# peer config on first deploy. Safe to leave on — public keys aren't secret.
- name: Show this host's public key (paste into OPNsense peer config)
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} wireguard pubkey:
      {{ wireguard_client_pubkey_slurp.content | b64decode | trim }}

- name: Render wg-quick config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "/etc/wireguard/{{ wireguard_client_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  vars:
    wireguard_client_private_key: "{{ wireguard_client_privkey_slurp.content | b64decode | trim }}"
  no_log: true
  notify: Restart wg-quick

- name: Enable and start wg-quick
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_client_interface }}"
    enabled: true
    state: started
    daemon_reload: true
