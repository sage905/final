---
- name: Validate role arguments
  ansible.builtin.validate_argument_spec:
    argument_spec: >-
      {{ (lookup('ansible.builtin.file',
                 role_path ~ '/meta/argument_specs.yml')
          | from_yaml)['argument_specs']['main']['options'] }}

- name: "Look up the {{ wordpress_user }} UID"
  ansible.builtin.getent:
    database: passwd
    key: "{{ wordpress_user }}"

- name: Install container runtime
  ansible.builtin.import_tasks: dependencies.yml

- name: Render compose project, secrets, and Caddy snippet
  ansible.builtin.import_tasks: install.yml

- name: Bring the stack up and reload Caddy
  ansible.builtin.import_tasks: bootstrap.yml
