---
- name: Ensure WordPress group exists
  ansible.builtin.group:
    name: "{{ wordpress_group }}"
    state: present

- name: Add admin users to the WordPress group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ wordpress_group }}"
    append: true
  loop: "{{ wordpress_group_members }}"
  when: wordpress_group_members | length > 0

# Top-level dir is Ansible-managed: compose, .env, secrets all live here
# with the wordpress group as owner so admins can SFTP-edit.
- name: Create the WordPress top-level directory
  ansible.builtin.file:
    path: "{{ wordpress_data_dir }}"
    state: directory
    owner: "{{ wordpress_user }}"
    group: "{{ wordpress_group }}"
    mode: "2775"

# Secrets dir is tighter — group-readable but not group-writable.
- name: Create WordPress secrets directory
  ansible.builtin.file:
    path: "{{ wordpress_data_dir }}/secrets"
    state: directory
    owner: "{{ wordpress_user }}"
    group: "{{ wordpress_group }}"
    mode: "0750"

# Container-managed runtime subtrees. Created ONLY if missing — once they
# exist, the wordpress + mariadb entrypoints take over ownership
# (www-data and mysql respectively). The setgid bit on initial creation
# means files those containers write inherit the wordpress group, so
# admins in that group can read/edit via SFTP without sudo.
#
# Initial owner UID 33 matches www-data inside the wordpress image, so
# the entrypoint sees the dir already-owned-correctly and skips its
# recursive chown — preserving the setgid bit.
- name: Stat WordPress runtime dir
  ansible.builtin.stat:
    path: "{{ wordpress_data_dir }}/wordpress"
  register: wordpress_runtime_stat

- name: Create WordPress runtime dir (first run only)
  ansible.builtin.file:
    path: "{{ wordpress_data_dir }}/wordpress"
    state: directory
    owner: "33"
    group: "{{ wordpress_group }}"
    mode: "2775"
  when: not wordpress_runtime_stat.stat.exists

- name: Stat WordPress DB dir
  ansible.builtin.stat:
    path: "{{ wordpress_data_dir }}/wordpress-db"
  register: wordpress_db_stat

- name: Create WordPress DB dir (first run only)
  ansible.builtin.file:
    path: "{{ wordpress_data_dir }}/wordpress-db"
    state: directory
    owner: "{{ wordpress_user }}"
    group: "{{ wordpress_group }}"
    mode: "2775"
  when: not wordpress_db_stat.stat.exists

- name: Generate persistent secrets when not supplied
  ansible.builtin.include_tasks: _generate_secret.yml
  loop:
    - name: db_password
      override: "{{ wordpress_db_password }}"
      length: 24
    - name: db_root_password
      override: "{{ wordpress_db_root_password }}"
      length: 24
  loop_control:
    loop_var: secret

# Secrets live on the target host (not the controller), so use `slurp`.
- name: Slurp generated secrets from the host
  ansible.builtin.slurp:
    src: "{{ wordpress_data_dir }}/secrets/{{ item }}"
  loop:
    - db_password
    - db_root_password
  register: wordpress_secret_slurp
  no_log: true

- name: Resolve effective secrets
  ansible.builtin.set_fact:
    wordpress_effective_db_password: "{{ wordpress_db_password
                                         if wordpress_db_password | length > 0
                                         else wordpress_secret_slurp.results[0].content | b64decode | trim }}"
    wordpress_effective_db_root_password: "{{ wordpress_db_root_password
                                              if wordpress_db_root_password | length > 0
                                              else wordpress_secret_slurp.results[1].content | b64decode | trim }}"
  no_log: true

- name: Render PHP upload-limits ini
  ansible.builtin.template:
    src: uploads.ini.j2
    dest: "{{ wordpress_data_dir }}/uploads.ini"
    owner: "{{ wordpress_user }}"
    group: "{{ wordpress_group }}"
    mode: "0664"
  notify: Recreate wordpress stack

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ wordpress_data_dir }}/docker-compose.yml"
    owner: "{{ wordpress_user }}"
    group: "{{ wordpress_group }}"
    mode: "0660"
  notify: Recreate wordpress stack
