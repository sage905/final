---
# --- Stack location -----------------------------------------------------------
wordpress_data_dir: /srv/wordpress

# --- WordPress + database images ---------------------------------------------
wordpress_image: docker.io/library/wordpress:latest
wordpress_db_image: docker.io/library/mariadb:10.11
wordpress_db_name: wordpress
wordpress_db_user: wordpress
# Leave empty to auto-generate and persist under {{ wordpress_data_dir }}/secrets/.
wordpress_db_password: ""
wordpress_db_root_password: ""

# Name of the external Podman network this stack joins. The caddy role
# creates it; this role attaches as external: true.
wordpress_shared_network: web

# --- Container runtime install ------------------------------------------------
wordpress_install_podman: true

# Rootful: stack runs via system podman. wordpress_user owns the files
# on disk. Apache inside the wordpress image drops to www-data (UID 33)
# and will chown /var/www/html accordingly on first start, so after that
# /srv/wordpress/wordpress is owned by host UID 33 (www-data on Ubuntu).
# For top-level config (compose, env) the wordpress group grants admin
# access; for runtime files (wp-content), use Portainer's exec terminal
# or `sudo` since they end up owned by www-data:www-data.
wordpress_user: root

# Group that owns WordPress's files. Admins in wordpress_group_members
# can read/write /srv/wordpress top-level files via SFTP. Secrets dir
# stays group-readable but not group-writable.
wordpress_group: wordpress
wordpress_group_members: []
