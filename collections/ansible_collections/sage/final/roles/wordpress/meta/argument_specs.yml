---
argument_specs:
  main:
    short_description: Deploy WordPress behind the shared Caddy.
    options:
      wordpress_data_dir:
        type: path
        default: /srv/wordpress
      wordpress_image:
        type: str
        default: docker.io/library/wordpress:latest
      wordpress_db_image:
        type: str
        default: docker.io/library/mariadb:10.11
      wordpress_db_name:
        type: str
        default: wordpress
      wordpress_db_user:
        type: str
        default: wordpress
      # wordpress_db_password and wordpress_db_root_password are
      # vault-prone and intentionally NOT in this spec — see the
      # validate_argument_spec / AnsibleVaultEncryptedUnicode note in
      # other role argument_specs. Both default to "" in defaults/main.yml,
      # auto-generated on the target host if not supplied.
      wordpress_shared_network:
        type: str
        default: web
        description: External Podman network shared with the caddy role.
      wordpress_install_podman:
        type: bool
        default: true
      wordpress_user:
        type: str
        default: containers
      wordpress_group:
        type: str
        default: wordpress
      wordpress_group_members:
        type: list
        elements: str
        default: []
        description: >-
          Additional system users to add to wordpress_group. wordpress_user
          is always a member. Listed users must already exist on the host.
