---
portainer_data_dir: /srv/portainer
# Portainer CE LTS. Override to portainer-ee:lts for the commercial edition
# (requires a license key entered at first-run).
portainer_image: docker.io/portainer/portainer-ce:lts
# Portainer's HTTP listener inside the container. Caddy fronts it.
portainer_container_port: 9000

# Shared infra provided by sage.final.caddy.
portainer_shared_network: web

# Docker is installed once per host by the dedicated play in site.yml. Leave
# this false; set true only to install Docker from this role on a standalone run.
portainer_install_docker: false

# Rootful: stack runs via system Docker. Portainer mounts the system
# Docker socket (/var/run/docker.sock) and sees every container the
# other roles deployed.
portainer_user: root

# Group that owns Portainer's files. The meaningful admin grant happens
# *inside* Portainer (its own RBAC, teams, and per-stack access — set up
# after first login). The host group only governs SFTP access to
# /srv/portainer, which is rarely useful.
portainer_group: portainer
portainer_group_members: []
