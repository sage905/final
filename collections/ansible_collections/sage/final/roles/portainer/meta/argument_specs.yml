---
argument_specs:
  main:
    short_description: Deploy Portainer CE behind the shared Caddy.
    options:
      portainer_data_dir:
        type: path
        default: /srv/portainer
      portainer_image:
        type: str
        default: docker.io/portainer/portainer-ce:lts
      portainer_container_port:
        type: int
        default: 9000
      portainer_shared_network:
        type: str
        default: web
      portainer_install_podman:
        type: bool
        default: true
      portainer_user:
        type: str
        default: containers
      portainer_group:
        type: str
        default: portainer
      portainer_group_members:
        type: list
        elements: str
        default: []
        description: >-
          Additional system users to add to portainer_group. portainer_user
          is always a member. Listed users must already exist on the host.
