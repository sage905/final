---
- name: Ensure Portainer group exists
  ansible.builtin.group:
    name: "{{ portainer_group }}"
    state: present

- name: Add users to the Portainer group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ portainer_group }}"
    append: true
  loop: "{{ ([portainer_user] + portainer_group_members) | unique }}"

- name: Create Portainer directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ portainer_user }}"
    group: "{{ portainer_group }}"
    mode: "2775"
  loop:
    - "{{ portainer_data_dir }}"
    - "{{ portainer_data_dir }}/data"

# `:U` on the compose mount only chowns files within podman's subuid range.
# Files left behind by a prior root or rootful run can be outside that range
# and trigger "lchown: operation not permitted" on container start.
- name: Normalize ownership of runtime dirs (heals prior-run leftovers)
  ansible.builtin.file:
    path: "{{ portainer_data_dir }}/data"
    state: directory
    owner: "{{ portainer_user }}"
    group: "{{ portainer_group }}"
    mode: "u=rwX,g=rwX,o="
    recurse: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_data_dir }}/docker-compose.yml"
    owner: "{{ portainer_user }}"
    group: "{{ portainer_group }}"
    mode: "0660"
  notify: Recreate portainer stack
