---
- name: Ensure Portainer group exists
  ansible.builtin.group:
    name: "{{ portainer_group }}"
    state: present

- name: Add admin users to the Portainer group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ portainer_group }}"
    append: true
  loop: "{{ portainer_group_members }}"
  when: portainer_group_members | length > 0

- name: Create Portainer directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ portainer_user }}"
    group: "{{ portainer_group }}"
    mode: "2775"
  loop:
    - "{{ portainer_data_dir }}"
    - "{{ portainer_data_dir }}/data"

# Heal ownership left over from prior rootless runs (subuid-mapped UIDs)
# back to the rootful owner+group with setgid + group-write.
- name: Normalize ownership of runtime dirs (heals prior-run leftovers)
  ansible.builtin.file:
    path: "{{ portainer_data_dir }}/data"
    state: directory
    owner: "{{ portainer_user }}"
    group: "{{ portainer_group }}"
    mode: "u=rwX,g=rwX,o="
    recurse: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_data_dir }}/docker-compose.yml"
    owner: "{{ portainer_user }}"
    group: "{{ portainer_group }}"
    mode: "0660"
  notify: Recreate portainer stack
