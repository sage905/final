---
- name: Ensure pelican group exists
  ansible.builtin.group:
    name: "{{ pelican_panel_group }}"
    state: present

- name: Add admin users to the pelican group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ pelican_panel_group }}"
    append: true
  loop: "{{ pelican_panel_group_members }}"
  when: pelican_panel_group_members | length > 0

# Top-level dir is Ansible-managed (compose project at root).
- name: Create the pelican top-level directory
  ansible.builtin.file:
    path: "{{ pelican_panel_data_dir }}"
    state: directory
    owner: "{{ pelican_panel_user }}"
    group: "{{ pelican_panel_group }}"
    mode: "2775"

# Container-managed runtime subtrees. Created ONLY if missing — once they
# exist, Pelican's entrypoint takes ownership (chowns /pelican-data to the
# container's web user on first boot). The setgid bit on initial creation
# means container-written files inherit the pelican group, so admins can
# read via SFTP without sudo.
- name: Stat pelican runtime subdirs
  ansible.builtin.stat:
    path: "{{ pelican_panel_data_dir }}/{{ item }}"
  loop:
    - data
    - logs
  register: pelican_panel_subdir_stat

- name: Create pelican runtime subdirs (first run only)
  ansible.builtin.file:
    path: "{{ pelican_panel_data_dir }}/{{ item.item }}"
    state: directory
    owner: "{{ pelican_panel_user }}"
    group: "{{ pelican_panel_group }}"
    mode: "2775"
  loop: "{{ pelican_panel_subdir_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pelican_panel_data_dir }}/docker-compose.yml"
    owner: "{{ pelican_panel_user }}"
    group: "{{ pelican_panel_group }}"
    mode: "0660"
  notify: Recreate pelican stack
