---
- name: Ensure pelican group exists
  ansible.builtin.group:
    name: "{{ pelican_panel_group }}"
    state: present

- name: Add admin users to the pelican group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ pelican_panel_group }}"
    append: true
  loop: "{{ pelican_panel_group_members }}"
  when: pelican_panel_group_members | length > 0

# Top-level dir is Ansible-managed (compose project at root).
- name: Create the pelican top-level directory
  ansible.builtin.file:
    path: "{{ pelican_panel_data_dir }}"
    state: directory
    owner: "{{ pelican_panel_user }}"
    group: "{{ pelican_panel_group }}"
    mode: "2775"

# Runtime bind mounts. The Pelican image runs as www-data
# (pelican_panel_container_uid) and writes its SQLite DB, .env, and logs
# here, so these dirs must be owned by that UID — a root-owned bind mount
# masks the image's own chown and the container gets "Permission denied".
# Owner is asserted every run (not first-run-gated) so a previously
# root-owned dir self-heals. setgid keeps the pelican group on new files
# for SFTP read access; the container UID never changes it back.
- name: Ensure pelican runtime dirs are owned by the container user
  ansible.builtin.file:
    path: "{{ pelican_panel_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ pelican_panel_container_uid }}"
    group: "{{ pelican_panel_group }}"
    mode: "2775"
  loop:
    - data
    - logs

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pelican_panel_data_dir }}/docker-compose.yml"
    owner: "{{ pelican_panel_user }}"
    group: "{{ pelican_panel_group }}"
    mode: "0660"
  notify: Recreate pelican stack
