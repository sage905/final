---
- name: Ensure Glance group exists
  ansible.builtin.group:
    name: "{{ glance_group }}"
    state: present

- name: Add admin users to the Glance group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ glance_group }}"
    append: true
  loop: "{{ glance_group_members }}"
  when: glance_group_members | length > 0

- name: Create Glance directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ glance_user }}"
    group: "{{ glance_group }}"
    mode: "2775"
  loop:
    - "{{ glance_data_dir }}"
    - "{{ glance_data_dir }}/config"

# Heal ownership left over from prior rootless runs (subuid-mapped UIDs)
# back to the rootful owner+group with setgid + group-write.
- name: Normalize ownership of runtime dirs (heals prior-run leftovers)
  ansible.builtin.file:
    path: "{{ glance_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ glance_user }}"
    group: "{{ glance_group }}"
    mode: "u=rwX,g=rwX,o="
    recurse: true
  loop:
    - config

- name: Seed an initial glance.yml when missing
  ansible.builtin.copy:
    dest: "{{ glance_data_dir }}/config/glance.yml"
    content: |
      pages:
        - name: Home
          columns: []
    force: false
    owner: "{{ glance_user }}"
    group: "{{ glance_group }}"
    mode: "0660"
  when: glance_seed_config
  notify: Recreate glance stack

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ glance_data_dir }}/docker-compose.yml"
    owner: "{{ glance_user }}"
    group: "{{ glance_group }}"
    mode: "0660"
  notify: Recreate glance stack
