---
argument_specs:
  main:
    short_description: Deploy Glance behind the shared Caddy.
    options:
      glance_data_dir:
        type: path
        default: /srv/glance
      glance_image:
        type: str
        default: docker.io/glanceapp/glance:latest
      glance_container_port:
        type: int
        default: 8080
      glance_seed_config:
        type: bool
        default: true
      glance_shared_network:
        type: str
        default: web
      glance_install_docker:
        type: bool
        default: false
      glance_user:
        type: str
        default: containers
      glance_group:
        type: str
        default: glance
      glance_group_members:
        type: list
        elements: str
        default: []
        description: >-
          Additional system users to add to glance_group. glance_user is
          always a member. Listed users must already exist on the host.
