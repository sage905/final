---
glance_data_dir: /srv/glance
glance_image: docker.io/glanceapp/glance:latest
glance_container_port: 8080

# Initial glance.yml is templated once; edit
# {{ glance_data_dir }}/config/glance.yml directly after deploy.
glance_seed_config: true

# Shared infra provided by sage.final.caddy.
glance_shared_network: web

glance_install_podman: true

# Rootful: stack runs via system podman. glance_user owns the files on
# disk. The glance image runs as root inside, so root ownership on the
# host matches container writes (no `:U` needed).
glance_user: root

# Group that owns Glance's files. Admins in glance_group_members can
# read/write /srv/glance via SFTP.
glance_group: glance
glance_group_members: []
