---
- name: Ensure seerr group exists
  ansible.builtin.group:
    name: "{{ seerr_group }}"
    state: present

- name: Add admin users to the seerr group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ seerr_group }}"
    append: true
  loop: "{{ seerr_group_members }}"
  when: seerr_group_members | length > 0

# Top-level dir holds the compose file (host-owned, group-writable for SFTP).
# The container writes its data under config/; the official image runs as its
# own user and chowns what it needs through the bind mount.
- name: Create the seerr directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ seerr_user }}"
    group: "{{ seerr_group }}"
    mode: "2775"
  loop:
    - "{{ seerr_data_dir }}"
    - "{{ seerr_data_dir }}/config"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ seerr_data_dir }}/docker-compose.yml"
    owner: "{{ seerr_user }}"
    group: "{{ seerr_group }}"
    mode: "0660"
  notify: Recreate seerr stack
