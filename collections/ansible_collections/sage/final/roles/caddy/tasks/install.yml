---
- name: Create Caddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ caddy_user }}"
    group: "{{ caddy_user }}"
    mode: "0755"
  loop:
    - "{{ caddy_data_dir }}"
    - "{{ caddy_data_dir }}/conf.d"
    - "{{ caddy_data_dir }}/data"
    - "{{ caddy_data_dir }}/config"

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_data_dir }}/Caddyfile"
    owner: "{{ caddy_user }}"
    group: "{{ caddy_user }}"
    mode: "0644"
  notify: Reload caddy

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ caddy_data_dir }}/docker-compose.yml"
    owner: "{{ caddy_user }}"
    group: "{{ caddy_user }}"
    mode: "0640"
  notify: Recreate caddy stack
