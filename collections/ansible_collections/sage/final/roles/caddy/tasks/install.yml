---
- name: Ensure Caddy group exists
  ansible.builtin.group:
    name: "{{ caddy_group }}"
    state: present

- name: Add users to the Caddy group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ caddy_group }}"
    append: true
  loop: "{{ ([caddy_user] + caddy_group_members) | unique }}"

- name: Create Caddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: "2775"
  loop:
    - "{{ caddy_data_dir }}"
    - "{{ caddy_data_dir }}/conf.d"
    - "{{ caddy_data_dir }}/data"
    - "{{ caddy_data_dir }}/config"

# `:U` on the compose mounts only chowns files within podman's subuid range.
# Files left behind by a prior root or rootful run can be outside that range
# and trigger "lchown: operation not permitted" on container start. Run a
# pre-emptive recursive chown as root to normalize ownership.
- name: Normalize ownership of runtime dirs (heals prior-run leftovers)
  ansible.builtin.file:
    path: "{{ caddy_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: "u=rwX,g=rwX,o="
    recurse: true
  loop:
    - data
    - config

# Pre-1.0 of this collection had each app role drop its own *.caddy snippet
# into conf.d. Sites are now declared in caddy_sites and rendered into the
# main Caddyfile, so the old per-app snippets would duplicate site blocks
# and cause Caddy to fail to start. Remove them on upgrade.
- name: Remove stale per-app caddy snippets (pre-caddy_sites refactor)
  ansible.builtin.file:
    path: "{{ caddy_data_dir }}/conf.d/{{ item }}.caddy"
    state: absent
  loop:
    - pterodactyl
    - wordpress
    - dashy
    - glance
    - bracket
    - jellyfin
  notify: Reload caddy

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_data_dir }}/Caddyfile"
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: "0660"
  notify: Reload caddy

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ caddy_data_dir }}/docker-compose.yml"
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: "0660"
  notify: Recreate caddy stack
