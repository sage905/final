---
- name: Bring up Caddy as {{ caddy_user }}
  become: true
  become_user: "{{ caddy_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[caddy_user][1] }}"
  block:
    - name: Ensure the shared Podman network exists
      ansible.builtin.command:
        cmd: "podman network create {{ caddy_shared_network }}"
      register: caddy_network_result
      changed_when: caddy_network_result.rc == 0
      failed_when:
        - caddy_network_result.rc != 0
        - "'already exists' not in caddy_network_result.stderr"

    - name: Bring the Caddy stack up
      ansible.builtin.command:
        cmd: podman-compose up -d --remove-orphans
        chdir: "{{ caddy_data_dir }}"
      register: caddy_compose_result
      changed_when: "'Creating' in caddy_compose_result.stdout
                     or 'Recreating' in caddy_compose_result.stdout
                     or 'Started' in caddy_compose_result.stderr"
