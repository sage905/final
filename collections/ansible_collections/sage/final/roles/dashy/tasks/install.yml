---
- name: Ensure Dashy group exists
  ansible.builtin.group:
    name: "{{ dashy_group }}"
    state: present

- name: Add admin users to the Dashy group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ dashy_group }}"
    append: true
  loop: "{{ dashy_group_members }}"
  when: dashy_group_members | length > 0

- name: Create Dashy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ dashy_user }}"
    group: "{{ dashy_group }}"
    mode: "2775"
  loop:
    - "{{ dashy_data_dir }}"
    - "{{ dashy_data_dir }}/user-data"

# Heal ownership left over from prior rootless runs (subuid-mapped UIDs)
# back to the rootful owner+group with setgid + group-write.
- name: Normalize ownership of runtime dirs (heals prior-run leftovers)
  ansible.builtin.file:
    path: "{{ dashy_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ dashy_user }}"
    group: "{{ dashy_group }}"
    mode: "u=rwX,g=rwX,o="
    recurse: true
  loop:
    - user-data

- name: Seed an initial conf.yml when missing
  ansible.builtin.copy:
    dest: "{{ dashy_data_dir }}/user-data/conf.yml"
    content: |
      ---
      appConfig: {}
      pageInfo:
        title: Dashy
      sections: []
    force: false
    owner: "{{ dashy_user }}"
    group: "{{ dashy_group }}"
    mode: "0660"
  when: dashy_seed_config
  notify: Recreate dashy stack

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dashy_data_dir }}/docker-compose.yml"
    owner: "{{ dashy_user }}"
    group: "{{ dashy_group }}"
    mode: "0660"
  notify: Recreate dashy stack
