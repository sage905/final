---
- name: Create Dashy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ dashy_user }}"
    group: "{{ dashy_user }}"
    mode: "0755"
  loop:
    - "{{ dashy_data_dir }}"
    - "{{ dashy_data_dir }}/user-data"

# `:U` on the compose mounts only chowns files within podman's subuid range.
# Files left behind by a prior root or rootful run can be outside that range
# and trigger "lchown: operation not permitted" on container start. Run a
# pre-emptive recursive chown as root to normalize ownership.
- name: Normalize ownership of runtime dirs (heals prior-run leftovers)
  ansible.builtin.file:
    path: "{{ dashy_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ dashy_user }}"
    group: "{{ dashy_user }}"
    recurse: true
  loop:
    - user-data

- name: Seed an initial conf.yml when missing
  ansible.builtin.copy:
    dest: "{{ dashy_data_dir }}/user-data/conf.yml"
    content: |
      ---
      appConfig: {}
      pageInfo:
        title: Dashy
      sections: []
    force: false
    owner: "{{ dashy_user }}"
    group: "{{ dashy_user }}"
    mode: "0644"
  when: dashy_seed_config
  notify: Recreate dashy stack

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dashy_data_dir }}/docker-compose.yml"
    owner: "{{ dashy_user }}"
    group: "{{ dashy_user }}"
    mode: "0640"
  notify: Recreate dashy stack
