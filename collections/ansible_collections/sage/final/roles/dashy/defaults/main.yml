---
dashy_data_dir: /srv/dashy
dashy_image: docker.io/lissy93/dashy:latest
dashy_container_port: 8080

# Initial conf.yml is templated on first run and then left alone; edit
# {{ dashy_data_dir }}/user-data/conf.yml directly after deploy.
dashy_seed_config: true

# Shared infra provided by sage.final.caddy.
dashy_shared_network: web

dashy_install_podman: true

# Rootful: stack runs via system podman. dashy_user owns the files on
# disk. The dashy image runs as root inside, so root ownership on the
# host matches container writes (no `:U` needed).
dashy_user: root

# Group that owns Dashy's files. Admins in dashy_group_members can read
# and write /srv/dashy via SFTP (setgid + group-write modes set below).
dashy_group: dashy
dashy_group_members: []
