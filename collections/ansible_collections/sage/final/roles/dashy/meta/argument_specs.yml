---
argument_specs:
  main:
    short_description: Deploy Dashy behind the shared Caddy.
    options:
      dashy_data_dir:
        type: path
        default: /srv/dashy
      dashy_image:
        type: str
        default: docker.io/lissy93/dashy:latest
      dashy_container_port:
        type: int
        default: 8080
      dashy_seed_config:
        type: bool
        default: true
      dashy_shared_network:
        type: str
        default: web
      dashy_install_podman:
        type: bool
        default: true
      dashy_user:
        type: str
        default: containers
      dashy_group:
        type: str
        default: dashy
      dashy_group_members:
        type: list
        elements: str
        default: []
        description: >-
          Additional system users to add to dashy_group. dashy_user is
          always a member. Listed users must already exist on the host.
