---
# Publishing ports directly on this container only works on the shared network.
# Behind the VPN it shares the gateway's namespace and owns no ports of its own,
# so LAN exposure must be published on the surfshark container instead.
- name: Assert LAN exposure is configured on the right container
  ansible.builtin.assert:
    that:
      - flaresolverr_published_ports | length == 0
    fail_msg: >-
      flaresolverr_published_ports is set while FlareSolverr is routed through
      the VPN ({{ flaresolverr_vpn_container }}), so it cannot publish its own
      ports. To reach it from the LAN for troubleshooting, instead add
      "{{ flaresolverr_port }}:{{ flaresolverr_port }}" to the surfshark role's
      surfshark_published_ports AND "{{ flaresolverr_port }}" to
      surfshark_input_ports, then re-run --tags surfshark.
  when: flaresolverr_vpn_container | length > 0

- name: Ensure flaresolverr group exists
  ansible.builtin.group:
    name: "{{ flaresolverr_group }}"
    state: present

- name: Add admin users to the flaresolverr group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ flaresolverr_group }}"
    append: true
  loop: "{{ flaresolverr_group_members }}"
  when: flaresolverr_group_members | length > 0

# FlareSolverr keeps no persistent state, so this dir holds only the compose
# file (host-owned).
- name: Create the flaresolverr top-level directory
  ansible.builtin.file:
    path: "{{ flaresolverr_data_dir }}"
    state: directory
    owner: "{{ flaresolverr_user }}"
    group: "{{ flaresolverr_group }}"
    mode: "2775"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ flaresolverr_data_dir }}/docker-compose.yml"
    owner: "{{ flaresolverr_user }}"
    group: "{{ flaresolverr_group }}"
    mode: "0660"
  notify: Recreate flaresolverr stack
