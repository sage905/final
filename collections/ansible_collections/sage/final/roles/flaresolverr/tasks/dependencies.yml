---
- name: Assert that the target host is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: >-
      sage.final.flaresolverr currently supports Ubuntu only. Detected
      distribution: {{ ansible_facts['distribution'] | default('unknown') }}.

- name: Install the Docker engine and Compose plugin
  ansible.builtin.include_role:
    name: sage.final.docker
  when: flaresolverr_install_docker
