---
- name: Ensure radarr group exists
  ansible.builtin.group:
    name: "{{ radarr_group }}"
    state: present

- name: Add admin users to the radarr group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ radarr_group }}"
    append: true
  loop: "{{ radarr_group_members }}"
  when: radarr_group_members | length > 0

# Top-level dir holds the compose file (host-owned). /config is created and
# owned by the linuxserver PUID:PGID so the image can write through the mount.
- name: Create the radarr top-level directory
  ansible.builtin.file:
    path: "{{ radarr_data_dir }}"
    state: directory
    owner: "{{ radarr_user }}"
    group: "{{ radarr_group }}"
    mode: "2775"

- name: Create the radarr config directory (owned by the container user)
  ansible.builtin.file:
    path: "{{ radarr_data_dir }}/config"
    state: directory
    owner: "{{ radarr_puid }}"
    group: "{{ radarr_pgid }}"
    mode: "0775"

# The library (radarr_movies_path) and downloads (radarr_downloads_path) tree is
# owned by sage.final.disk_pool — the single source of truth for media-tree
# ownership and permissions — so this role no longer creates or chowns it.
# disk_pool must run before this role (it does in site.yml).

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ radarr_data_dir }}/docker-compose.yml"
    owner: "{{ radarr_user }}"
    group: "{{ radarr_group }}"
    mode: "0660"
  notify: Recreate radarr stack
