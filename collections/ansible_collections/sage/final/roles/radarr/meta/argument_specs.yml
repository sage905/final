---
argument_specs:
  main:
    short_description: Deploy Radarr routed through the Surfshark VPN gateway.
    options:
      radarr_data_dir:
        type: path
        default: /srv/radarr
      radarr_image:
        type: str
        default: lscr.io/linuxserver/radarr:latest
      radarr_container_name:
        type: str
        default: radarr
      radarr_container_port:
        type: int
        default: 7878
        description: >-
          Web UI port. Reached via the VPN container's name and must be listed
          in the surfshark role's surfshark_input_ports.
      radarr_vpn_container:
        type: str
        default: surfshark
        description: >-
          VPN gateway container whose network namespace Radarr joins
          (network_mode "container:<this>"). Set "" to run on the shared
          network instead.
      radarr_shared_network:
        type: str
        default: web
        description: >-
          Shared network used when radarr_vpn_container is empty (from
          sage.final.caddy).
      radarr_puid:
        type: int
        default: 1000
        description: linuxserver.io PUID; should own the media/downloads paths.
      radarr_pgid:
        type: int
        default: 1000
        description: >-
          linuxserver.io PGID; set to the shared media group's GID
          (sage.final.disk_pool disk_pool_group) so writes land in that group.
      radarr_umask:
        type: str
        default: "002"
        description: >-
          linuxserver.io UMASK. 002 keeps new files group-writable for the
          shared media group.
      radarr_timezone:
        type: str
        default: UTC
      radarr_movies_path:
        type: path
        default: /srv/bulk/media/movies
        description: Host movie library path, mounted at /movies.
      radarr_downloads_path:
        type: path
        default: /srv/bulk/downloads
        description: >-
          Host downloads path, mounted at /downloads. Use the same path on the
          download client so imports are hardlinks, not copies.
      radarr_install_docker:
        type: bool
        default: false
      radarr_user:
        type: str
        default: root
      radarr_group:
        type: str
        default: radarr
      radarr_group_members:
        type: list
        elements: str
        default: []
        description: >-
          Additional system users to add to radarr_group. Listed users must
          already exist on the host.
