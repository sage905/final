---
- name: Ensure Healthchecks group exists
  ansible.builtin.group:
    name: "{{ healthchecks_group }}"
    state: present

- name: Add admin users to the Healthchecks group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ healthchecks_group }}"
    append: true
  loop: "{{ healthchecks_group_members }}"
  when: healthchecks_group_members | length > 0

# Top-level dir is Ansible-managed (compose lives here).
- name: Create the Healthchecks top-level directory
  ansible.builtin.file:
    path: "{{ healthchecks_data_dir }}"
    state: directory
    owner: "{{ healthchecks_user }}"
    group: "{{ healthchecks_group }}"
    mode: "2775"

# Container-managed runtime subtree. UID 999 matches the `hc` user inside
# the healthchecks image (the image used to call it `app` at UID 1000 in
# older tags; current ones use `hc`/999). Pre-chowning here means the
# container's sqlite writes just work without depending on the runtime's `:U`
# mount flag (which is inconsistent across runtimes (Docker has none)
# versions). Stat-gated so we only set initial perms on first install.
- name: Stat Healthchecks data dir
  ansible.builtin.stat:
    path: "{{ healthchecks_data_dir }}/data"
  register: healthchecks_data_stat

- name: Create Healthchecks data dir (first run only)
  ansible.builtin.file:
    path: "{{ healthchecks_data_dir }}/data"
    state: directory
    owner: "999"
    group: "{{ healthchecks_group }}"
    mode: "2775"
  when: not healthchecks_data_stat.stat.exists

- name: Render local_settings.py override
  ansible.builtin.template:
    src: local_settings.py.j2
    dest: "{{ healthchecks_data_dir }}/local_settings.py"
    owner: "{{ healthchecks_user }}"
    group: "{{ healthchecks_group }}"
    mode: "0644"
  notify: Recreate healthchecks stack

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ healthchecks_data_dir }}/docker-compose.yml"
    owner: "{{ healthchecks_user }}"
    group: "{{ healthchecks_group }}"
    mode: "0660"
  notify: Recreate healthchecks stack
