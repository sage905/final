---
- name: Ensure Healthchecks group exists
  ansible.builtin.group:
    name: "{{ healthchecks_group }}"
    state: present

- name: Add admin users to the Healthchecks group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ healthchecks_group }}"
    append: true
  loop: "{{ healthchecks_group_members }}"
  when: healthchecks_group_members | length > 0

# Top-level dir is Ansible-managed (compose lives here).
- name: Create the Healthchecks top-level directory
  ansible.builtin.file:
    path: "{{ healthchecks_data_dir }}"
    state: directory
    owner: "{{ healthchecks_user }}"
    group: "{{ healthchecks_group }}"
    mode: "2775"

# Container-managed runtime subtree. Created ONLY if missing — once it
# exists, podman's :U flag on the data mount chowns it to the container's
# `app` UID (1000) on every container start, and we never touch it from
# Ansible again. Without the stat-gate, a recursive chown here would
# fight the :U-set ownership on every role run and break the running
# container's access to its sqlite database until the next Recreate.
- name: Stat Healthchecks data dir
  ansible.builtin.stat:
    path: "{{ healthchecks_data_dir }}/data"
  register: healthchecks_data_stat

- name: Create Healthchecks data dir (first run only)
  ansible.builtin.file:
    path: "{{ healthchecks_data_dir }}/data"
    state: directory
    owner: "{{ healthchecks_user }}"
    group: "{{ healthchecks_group }}"
    mode: "2775"
  when: not healthchecks_data_stat.stat.exists

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ healthchecks_data_dir }}/docker-compose.yml"
    owner: "{{ healthchecks_user }}"
    group: "{{ healthchecks_group }}"
    mode: "0660"
  notify: Recreate healthchecks stack
