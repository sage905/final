---
- name: Ensure Healthchecks group exists
  ansible.builtin.group:
    name: "{{ healthchecks_group }}"
    state: present

- name: Add admin users to the Healthchecks group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ healthchecks_group }}"
    append: true
  loop: "{{ healthchecks_group_members }}"
  when: healthchecks_group_members | length > 0

- name: Create Healthchecks directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ healthchecks_user }}"
    group: "{{ healthchecks_group }}"
    mode: "2775"
  loop:
    - "{{ healthchecks_data_dir }}"
    - "{{ healthchecks_data_dir }}/data"

# Heal ownership left over from prior runs back to the rootful
# owner+group with setgid + group-write. The :U flag on the data mount
# will further chown to the container's `app` UID at start time.
- name: Normalize ownership of runtime dirs (heals prior-run leftovers)
  ansible.builtin.file:
    path: "{{ healthchecks_data_dir }}/data"
    state: directory
    owner: "{{ healthchecks_user }}"
    group: "{{ healthchecks_group }}"
    mode: "u=rwX,g=rwX,o="
    recurse: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ healthchecks_data_dir }}/docker-compose.yml"
    owner: "{{ healthchecks_user }}"
    group: "{{ healthchecks_group }}"
    mode: "0660"
  notify: Recreate healthchecks stack
