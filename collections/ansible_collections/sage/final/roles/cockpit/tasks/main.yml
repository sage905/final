---
- name: Assert that the target host is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: >-
      The sage.final.cockpit role only supports Ubuntu. Detected
      distribution: {{ ansible_facts['distribution'] | default('unknown') }}.

- name: Refresh the apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Add the {{ ansible_facts['distribution_release'] }}-backports apt source
  ansible.builtin.apt_repository:
    repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }}-backports main universe"
    state: present
    filename: "ubuntu-{{ ansible_facts['distribution_release'] }}-backports"
    update_cache: true
  register: cockpit_backports_add
  failed_when: false
  when: cockpit_use_backports

- name: Warn when the backports pocket is unavailable
  ansible.builtin.debug:
    msg: >-
      {{ ansible_facts['distribution_release'] }}-backports could not be
      enabled on this host (likely because the pocket has not opened for
      this release yet). Cockpit will install from the main pocket.
  when:
    - cockpit_use_backports
    - cockpit_backports_add.failed | default(false)

- name: Install Cockpit
  ansible.builtin.apt:
    name: "{{ cockpit_packages }}"
    state: present
  notify: Restart cockpit

- name: Enable and start the Cockpit socket
  ansible.builtin.systemd:
    name: "{{ cockpit_service }}"
    enabled: true
    state: started

- name: Allow Cockpit through UFW
  community.general.ufw:
    rule: allow
    port: "{{ cockpit_port }}"
    proto: tcp
    comment: Cockpit web UI
  when: cockpit_manage_firewall
