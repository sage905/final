---
# Packages to install. The base `cockpit` metapackage pulls in the web UI,
# bridge, and recommended plugins. `cockpit-podman` adds the container
# management UI, which is natural to include since the rest of this
# collection deploys everything via Podman.
# Override to add or remove modules like `cockpit-machines`,
# `cockpit-networkmanager`, etc.
cockpit_packages:
  - cockpit
  - cockpit-podman

# Whether to install from the `-backports` pocket on Ubuntu. Upstream
# recommends this on 22.04 and newer to get current Cockpit releases.
cockpit_use_backports: true

# The systemd unit Cockpit ships is socket-activated.
cockpit_service: cockpit.socket

# Manage the UFW rule for the Cockpit web UI (port 9090/tcp).
# Set to false on hosts where firewall rules are managed elsewhere.
cockpit_manage_firewall: true
cockpit_port: 9090
