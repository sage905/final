---
- name: "Check whether secret {{ secret.name }} already exists"
  ansible.builtin.stat:
    path: "{{ bracket_data_dir }}/secrets/{{ secret.name }}"
  register: bracket_secret_stat

- name: "Generate secret {{ secret.name }}"
  when:
    - not bracket_secret_stat.stat.exists
    - secret.override | length == 0
  block:
    - name: "Generate {{ secret.length }} random bytes for {{ secret.name }}"
      ansible.builtin.command:
        cmd: "openssl rand -base64 {{ secret.length }}"
      register: bracket_secret_value
      changed_when: true

    - name: "Persist secret {{ secret.name }}"
      ansible.builtin.copy:
        content: "{{ bracket_secret_value.stdout }}\n"
        dest: "{{ bracket_data_dir }}/secrets/{{ secret.name }}"
        owner: "{{ bracket_user }}"
        group: "{{ bracket_group }}"
        mode: "0640"
      no_log: true
