---
- name: Ensure Bracket group exists
  ansible.builtin.group:
    name: "{{ bracket_group }}"
    state: present

- name: Add admin users to the Bracket group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ bracket_group }}"
    append: true
  loop: "{{ bracket_group_members }}"
  when: bracket_group_members | length > 0

# Top-level dir is Ansible-managed (compose lives here).
- name: Create the Bracket top-level directory
  ansible.builtin.file:
    path: "{{ bracket_data_dir }}"
    state: directory
    owner: "{{ bracket_user }}"
    group: "{{ bracket_group }}"
    mode: "2775"

# Secrets dir is tighter — owner+group only, no group-writable (secrets
# files are auto-generated, no admin should be hand-editing them).
- name: Create Bracket secrets directory
  ansible.builtin.file:
    path: "{{ bracket_data_dir }}/secrets"
    state: directory
    owner: "{{ bracket_user }}"
    group: "{{ bracket_group }}"
    mode: "0750"

# Container-managed runtime subtrees. Created ONLY if missing — once they
# exist, postgres takes over /postgres ownership on first start.
- name: Stat Bracket runtime subdirs
  ansible.builtin.stat:
    path: "{{ bracket_data_dir }}/{{ item }}"
  loop:
    - postgres
    - static
  register: bracket_subdir_stat

- name: Create Bracket runtime subdirs (first run only)
  ansible.builtin.file:
    path: "{{ bracket_data_dir }}/{{ item.item }}"
    state: directory
    owner: "{{ bracket_user }}"
    group: "{{ bracket_group }}"
    mode: "2775"
  loop: "{{ bracket_subdir_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Generate the DB password if not supplied
  ansible.builtin.include_tasks: _generate_secret.yml
  loop:
    - name: db_password
      override: "{{ bracket_db_password }}"
      length: 24
  loop_control:
    loop_var: secret

# Secrets live on the target host (not the controller), so use `slurp`.
- name: Slurp the DB password from the host
  ansible.builtin.slurp:
    src: "{{ bracket_data_dir }}/secrets/db_password"
  register: bracket_db_password_slurp
  no_log: true
  when: bracket_db_password | length == 0

- name: Resolve the effective DB password
  ansible.builtin.set_fact:
    bracket_effective_db_password: "{{ bracket_db_password
                                       if bracket_db_password | length > 0
                                       else bracket_db_password_slurp.content | b64decode | trim }}"
  no_log: true

# The published image bakes VITE_API_BASE_URL=http://localhost:8400/api into
# the frontend bundle (served from /app/frontend-dist), which breaks behind
# the public FQDN — the browser tries to reach its own localhost. There is no
# runtime override (Vite inlines it at build time), so extract the assets,
# rewrite the baked origin to the public FQDN, and bind-mount them back
# read-only. Re-extracted only when the image ID changes, to stay in sync.
- name: Create the patched frontend-dist directory
  ansible.builtin.file:
    path: "{{ bracket_data_dir }}/frontend-dist"
    state: directory
    owner: "{{ bracket_user }}"
    group: "{{ bracket_group }}"
    mode: "0755"

- name: Pull the Bracket image
  ansible.builtin.command:
    cmd: "docker pull {{ bracket_image }}"
  register: bracket_pull
  changed_when: "'Storing signatures' in bracket_pull.stdout"

- name: Get the Bracket image ID
  ansible.builtin.command:
    cmd: "docker images --quiet --no-trunc {{ bracket_image }}"
  register: bracket_image_id
  changed_when: false

- name: Read the last-patched image marker
  ansible.builtin.slurp:
    src: "{{ bracket_data_dir }}/frontend-dist/.patched-image-id"
  register: bracket_dist_marker
  failed_when: false
  changed_when: false

- name: Extract and patch the frontend assets when the image changed
  when: >-
    bracket_dist_marker.content is not defined
    or (bracket_dist_marker.content | b64decode | trim) != bracket_image_id.stdout | trim
  notify: Recreate bracket stack
  block:
    - name: Remove any stale extraction container
      ansible.builtin.command:
        cmd: docker rm -f bracket-extract
      changed_when: false
      failed_when: false

    - name: Reset the patched frontend-dist directory
      ansible.builtin.file:
        path: "{{ bracket_data_dir }}/frontend-dist"
        state: "{{ item }}"
        owner: "{{ bracket_user }}"
        group: "{{ bracket_group }}"
        mode: "0755"
      loop:
        - absent
        - directory

    - name: Create a transient container to extract the assets
      ansible.builtin.command:
        cmd: "docker create --name bracket-extract {{ bracket_image }}"
      changed_when: true

    - name: Copy frontend-dist out of the image
      ansible.builtin.command:
        cmd: "docker cp bracket-extract:/app/frontend-dist/. {{ bracket_data_dir }}/frontend-dist/"
      changed_when: true

    - name: Remove the transient container
      ansible.builtin.command:
        cmd: "docker rm bracket-extract"
      changed_when: true

    - name: Rewrite the baked API origin to the public FQDN
      ansible.builtin.shell:
        cmd: >-
          grep -rl 'http://localhost:8400' {{ bracket_data_dir }}/frontend-dist
          | xargs -r sed -i 's#http://localhost:8400#https://{{ bracket_fqdn }}#g'
      changed_when: true

    - name: Record the patched image ID
      ansible.builtin.copy:
        content: "{{ bracket_image_id.stdout | trim }}\n"
        dest: "{{ bracket_data_dir }}/frontend-dist/.patched-image-id"
        owner: "{{ bracket_user }}"
        group: "{{ bracket_group }}"
        mode: "0644"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bracket_data_dir }}/docker-compose.yml"
    owner: "{{ bracket_user }}"
    group: "{{ bracket_group }}"
    mode: "0660"
  notify: Recreate bracket stack
