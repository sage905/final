---
- name: Ensure Bracket group exists
  ansible.builtin.group:
    name: "{{ bracket_group }}"
    state: present

- name: Add admin users to the Bracket group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ bracket_group }}"
    append: true
  loop: "{{ bracket_group_members }}"
  when: bracket_group_members | length > 0

# Top-level dir is Ansible-managed (compose lives here).
- name: Create the Bracket top-level directory
  ansible.builtin.file:
    path: "{{ bracket_data_dir }}"
    state: directory
    owner: "{{ bracket_user }}"
    group: "{{ bracket_group }}"
    mode: "2775"

# Secrets dir is tighter — owner+group only, no group-writable (secrets
# files are auto-generated, no admin should be hand-editing them).
- name: Create Bracket secrets directory
  ansible.builtin.file:
    path: "{{ bracket_data_dir }}/secrets"
    state: directory
    owner: "{{ bracket_user }}"
    group: "{{ bracket_group }}"
    mode: "0750"

# Container-managed runtime subtrees. Created ONLY if missing — once they
# exist, postgres takes over /postgres ownership on first start.
- name: Stat Bracket runtime subdirs
  ansible.builtin.stat:
    path: "{{ bracket_data_dir }}/{{ item }}"
  loop:
    - postgres
    - static
  register: bracket_subdir_stat

- name: Create Bracket runtime subdirs (first run only)
  ansible.builtin.file:
    path: "{{ bracket_data_dir }}/{{ item.item }}"
    state: directory
    owner: "{{ bracket_user }}"
    group: "{{ bracket_group }}"
    mode: "2775"
  loop: "{{ bracket_subdir_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Generate secrets if not supplied
  ansible.builtin.include_tasks: _generate_secret.yml
  loop:
    - name: db_password
      override: "{{ bracket_db_password }}"
      length: 24
    - name: jwt_secret
      override: "{{ bracket_jwt_secret }}"
      length: 48
  loop_control:
    loop_var: secret

# Secrets live on the target host (not the controller), so use `slurp`.
- name: Slurp the DB password from the host
  ansible.builtin.slurp:
    src: "{{ bracket_data_dir }}/secrets/db_password"
  register: bracket_db_password_slurp
  no_log: true
  when: bracket_db_password | length == 0

- name: Resolve the effective DB password
  ansible.builtin.set_fact:
    bracket_effective_db_password: "{{ bracket_db_password
                                       if bracket_db_password | length > 0
                                       else bracket_db_password_slurp.content | b64decode | trim }}"
  no_log: true

- name: Slurp the JWT secret from the host
  ansible.builtin.slurp:
    src: "{{ bracket_data_dir }}/secrets/jwt_secret"
  register: bracket_jwt_secret_slurp
  no_log: true
  when: bracket_jwt_secret | length == 0

- name: Resolve the effective JWT secret
  ansible.builtin.set_fact:
    bracket_effective_jwt_secret: "{{ bracket_jwt_secret
                                      if bracket_jwt_secret | length > 0
                                      else bracket_jwt_secret_slurp.content | b64decode | trim }}"
  no_log: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bracket_data_dir }}/docker-compose.yml"
    owner: "{{ bracket_user }}"
    group: "{{ bracket_group }}"
    mode: "0660"
  notify: Recreate bracket stack
