---
bracket_data_dir: /srv/bracket
bracket_fqdn: ""
bracket_image: ghcr.io/evroon/bracket:latest
bracket_container_port: 8400

# Postgres sidecar
bracket_db_image: docker.io/library/postgres:16-alpine
bracket_db_name: bracket
bracket_db_user: bracket
# Leave empty to auto-generate and persist under {{ bracket_data_dir }}/secrets/.
bracket_db_password: ""

# Signing key for Bracket's JWTs (required by its ProductionConfig).
# Leave empty to auto-generate and persist under {{ bracket_data_dir }}/secrets/.
bracket_jwt_secret: ""

# Shared infra provided by sage.final.caddy.
bracket_shared_network: web

bracket_install_podman: true

# Rootful: stack runs via system podman. bracket_user owns the files
# on disk. Postgres inside its container chowns its own data dir on
# first start (to postgres uid 70 or 999 depending on image), so admins
# can't usefully SFTP-edit /srv/bracket/postgres; for top-level config
# and secrets, the bracket group grants admin access.
bracket_user: root

# Group that owns Bracket's files. Admins in bracket_group_members can
# read/write /srv/bracket via SFTP. Secrets dir stays group-readable
# but not group-writable.
bracket_group: bracket
bracket_group_members: []
