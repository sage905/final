---
argument_specs:
  main:
    short_description: Deploy Bracket (tournament system) behind shared Caddy.
    options:
      bracket_data_dir:
        type: path
        default: /srv/bracket
      bracket_fqdn:
        type: str
        required: true
      bracket_image:
        type: str
        default: ghcr.io/evroon/bracket:latest
      bracket_container_port:
        type: int
        default: 8400
      bracket_db_image:
        type: str
        default: docker.io/library/postgres:16-alpine
      bracket_db_name:
        type: str
        default: bracket
      bracket_db_user:
        type: str
        default: bracket
      # bracket_db_password is vault-prone and intentionally NOT in this
      # spec — see the validate_argument_spec / AnsibleVaultEncryptedUnicode
      # note in other role argument_specs. Defaults to "" in
      # defaults/main.yml, auto-generated on the target host if blank.
      bracket_shared_network:
        type: str
        default: web
      bracket_install_podman:
        type: bool
        default: true
      bracket_user:
        type: str
        default: containers
      bracket_group:
        type: str
        default: bracket
      bracket_group_members:
        type: list
        elements: str
        default: []
        description: >-
          Additional system users to add to bracket_group. bracket_user
          is always a member. Listed users must already exist on the host.
