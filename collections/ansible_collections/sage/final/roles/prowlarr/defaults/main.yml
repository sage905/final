---
# --- Stack location -----------------------------------------------------------
prowlarr_data_dir: /srv/prowlarr

# --- Image --------------------------------------------------------------------
prowlarr_image: lscr.io/linuxserver/prowlarr:latest
prowlarr_container_name: prowlarr

# Web UI port Prowlarr listens on inside the VPN container's namespace. Reached
# via that container's name (Caddy upstream
# "{{ prowlarr_vpn_container }}:{{ prowlarr_webui_port }}") and must be listed in
# the surfshark role's surfshark_input_ports.
prowlarr_webui_port: 9696

# --- Network routing ----------------------------------------------------------
# Prowlarr queries indexers/trackers — the sensitive traffic the VPN exists for
# — so it routes through the VPN gateway by default. Sonarr/Radarr reach it at
# "{{ prowlarr_vpn_container }}:{{ prowlarr_webui_port }}", and Prowlarr reaches
# THEM on the shared network (gluetun's FIREWALL_OUTBOUND_SUBNETS allows the
# docker subnets). Set "" to run on the shared network instead.
prowlarr_vpn_container: surfshark
prowlarr_shared_network: web

# --- linuxserver.io user mapping ---------------------------------------------
# Same owner:group as the rest of the stack (Prowlarr only writes /config).
prowlarr_puid: 1000
prowlarr_pgid: 1010
prowlarr_umask: "002"
prowlarr_timezone: UTC

# --- Container runtime install ------------------------------------------------
# Docker is installed once per host by the dedicated play in site.yml. Leave
# this false; set true only to install Docker from this role on a standalone run.
prowlarr_install_docker: false

# Rootful: stack runs via system Docker. prowlarr_user owns the compose file on
# disk; /config inside is owned by prowlarr_puid:prowlarr_pgid.
prowlarr_user: root

# Group that owns the stack's files on the host. Admins in
# prowlarr_group_members can read/write {{ prowlarr_data_dir }} via SFTP.
prowlarr_group: prowlarr
prowlarr_group_members: []
