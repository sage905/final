---
# On the shared network (prowlarr_vpn_container empty): just ensure it exists.
- name: Ensure the shared Docker network exists
  ansible.builtin.command:
    cmd: "docker network create {{ prowlarr_shared_network }}"
  register: prowlarr_network_result
  changed_when: prowlarr_network_result.rc == 0
  failed_when:
    - prowlarr_network_result.rc != 0
    - "'already exists' not in prowlarr_network_result.stderr"
  when: prowlarr_vpn_container | length == 0

# Behind the VPN: Prowlarr has no network of its own — it joins the VPN
# container's namespace. So that container must exist and be running first.
- name: Get the VPN gateway container state
  ansible.builtin.command:
    cmd: >-
      docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}'
      {{ prowlarr_vpn_container }}
  register: prowlarr_vpn_state
  changed_when: false
  failed_when: false
  when: prowlarr_vpn_container | length > 0

- name: Assert the VPN gateway is running
  ansible.builtin.assert:
    that:
      - prowlarr_vpn_state.stdout == 'true'
    fail_msg: >-
      The VPN container '{{ prowlarr_vpn_container }}' is not running. Deploy
      sage.final.surfshark first (e.g. --tags surfshark) — Prowlarr routes all
      its traffic through it and cannot start without it.
  when: prowlarr_vpn_container | length > 0

- name: Bring up the Prowlarr stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ prowlarr_data_dir }}"
  register: prowlarr_compose_result
  changed_when: "'Creating' in prowlarr_compose_result.stdout
                 or 'Recreating' in prowlarr_compose_result.stdout
                 or 'Started' in prowlarr_compose_result.stderr"

# If the VPN container was recreated since Prowlarr last started, Prowlarr is now
# bound to a network namespace that no longer exists and is stuck restarting.
# `up -d` won't fix that, so force-recreate it to rejoin the current VPN
# namespace. (Only relevant when routed through the VPN.)
- name: Check the Prowlarr container status
  ansible.builtin.command:
    cmd: >-
      docker inspect -f '{{ "{{" }}.State.Status{{ "}}" }}'
      {{ prowlarr_container_name }}
  register: prowlarr_status
  changed_when: false
  failed_when: false
  when: prowlarr_vpn_container | length > 0

- name: Re-attach Prowlarr to the current VPN namespace
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate
    chdir: "{{ prowlarr_data_dir }}"
  when:
    - prowlarr_vpn_container | length > 0
    - prowlarr_status.stdout != 'running'
  changed_when: true
