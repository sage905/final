---
argument_specs:
  main:
    short_description: Install the Pterodactyl Wings daemon.
    options:
      pterodactyl_wings_version:
        type: str
        default: latest
        description: Release tag (without leading "v") or "latest".
      pterodactyl_wings_binary_path:
        type: path
        default: /usr/local/bin/wings
      pterodactyl_wings_arch_map:
        type: dict
        default:
          x86_64: amd64
          aarch64: arm64
      pterodactyl_wings_config_dir:
        type: path
        default: /etc/pterodactyl
      pterodactyl_wings_data_dir:
        type: path
        default: /srv/gameservers
        description: >-
          Wings root/data dir holding game-server volumes. Shared with
          sage.final.pelican_wings. The node's config.yml system.data must
          point under here.
      pterodactyl_wings_backup_dir:
        type: path
        default: /srv/bulk/gamebackups
        description: >-
          Where Wings stores server backups. Under /srv/bulk (excluded from
          the borg backup). The node's config.yml system.backup_directory
          must point here.
      pterodactyl_wings_log_dir:
        type: path
        default: /var/log/pterodactyl
      pterodactyl_wings_group:
        type: str
        default: pterodactyl_wings
      pterodactyl_wings_group_members:
        type: list
        elements: str
        default: []
        description: >-
          System users granted group-read access to /etc/pterodactyl and
          /var/log/pterodactyl. The data dir stays root-only. Listed
          users must already exist on the host.
      pterodactyl_wings_config_yaml:
        type: str
        default: ""
        description: Contents of /etc/pterodactyl/config.yml. Leave empty to paste from the Panel manually.
      pterodactyl_wings_enable_swap_accounting:
        type: bool
        default: true
        description: Adds swapaccount=1 to GRUB; reboot required for it to apply.
      pterodactyl_wings_install_podman:
        type: bool
        default: true
