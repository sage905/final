---
- name: Assert that the target host is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: >-
      sage.final.pterodactyl_wings currently supports Ubuntu only. Detected
      distribution: {{ ansible_facts['distribution'] | default('unknown') }}.

- name: Install Podman and expose its Docker-compatible socket
  when: pterodactyl_wings_install_podman
  block:
    - name: Install podman
      ansible.builtin.apt:
        name:
          - podman
          - uidmap
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable the Podman Docker-compatible API socket
      ansible.builtin.systemd:
        name: podman.socket
        enabled: true
        state: started
    - name: Ensure /etc/containers/registries.conf.d exists
      ansible.builtin.file:
        path: /etc/containers/registries.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Podman unqualified-search registries
      ansible.builtin.copy:
        dest: /etc/containers/registries.conf.d/00-shortnames.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          unqualified-search-registries = ["docker.io", "ghcr.io", "quay.io"]


- name: Enable cgroup swap accounting in GRUB
  when: pterodactyl_wings_enable_swap_accounting
  block:
    - name: Ensure swapaccount=1 is set on GRUB_CMDLINE_LINUX_DEFAULT
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?:(?!swapaccount=1).)*)"$'
        replace: '\1 swapaccount=1"'
      register: pterodactyl_wings_grub_change

    - name: Rebuild GRUB config
      ansible.builtin.command:
        cmd: update-grub
      when: pterodactyl_wings_grub_change.changed
      changed_when: true

    - name: Warn if a reboot is required to activate swap accounting
      ansible.builtin.debug:
        msg: >-
          GRUB updated to enable swapaccount=1. Reboot this host so Wings can
          enforce per-container memory+swap limits.
      when: pterodactyl_wings_grub_change.changed
