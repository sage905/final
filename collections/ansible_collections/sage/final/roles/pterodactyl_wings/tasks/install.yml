---
- name: Ensure pterodactyl_wings group exists
  ansible.builtin.group:
    name: "{{ pterodactyl_wings_group }}"
    state: present

- name: Add users to the pterodactyl_wings group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ pterodactyl_wings_group }}"
    append: true
  loop: "{{ pterodactyl_wings_group_members }}"
  when: pterodactyl_wings_group_members | length > 0

# Wings runs as a root system daemon. Group members can read config and
# logs (inspect + tail) but the data dir stays root-only — directly
# editing game-server state from outside Wings risks corrupting running
# servers. Admins should manage servers via the Panel UI / Wings API.
- name: Create Wings config and log directories (group readable)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ pterodactyl_wings_group }}"
    mode: "0750"
  loop:
    - "{{ pterodactyl_wings_config_dir }}"
    - "{{ pterodactyl_wings_log_dir }}"

- name: Create Wings data directory (root-only)
  ansible.builtin.file:
    path: "{{ pterodactyl_wings_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Resolve Wings download URL
  ansible.builtin.set_fact:
    pterodactyl_wings_download_url: >-
      {%- set arch = pterodactyl_wings_arch_map[ansible_facts['architecture']] -%}
      {%- if pterodactyl_wings_version == 'latest' -%}
      https://github.com/pterodactyl/wings/releases/latest/download/wings_linux_{{ arch }}
      {%- else -%}
      https://github.com/pterodactyl/wings/releases/download/v{{ pterodactyl_wings_version }}/wings_linux_{{ arch }}
      {%- endif -%}

- name: Download the Wings binary
  ansible.builtin.get_url:
    url: "{{ pterodactyl_wings_download_url }}"
    dest: "{{ pterodactyl_wings_binary_path }}"
    owner: root
    group: root
    mode: "0755"
    force: "{{ pterodactyl_wings_version != 'latest' }}"
  notify: Restart wings

- name: Install the Wings systemd unit
  ansible.builtin.template:
    src: wings.service.j2
    dest: /etc/systemd/system/wings.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart wings
