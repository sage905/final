---
- name: Validate role arguments
  ansible.builtin.validate_argument_spec:
    argument_spec: >-
      {{ (lookup('ansible.builtin.file',
                 role_path ~ '/meta/argument_specs.yml')
          | from_yaml)['argument_specs']['main']['options'] }}

- name: "Look up the {{ surfshark_user }} UID"
  ansible.builtin.getent:
    database: passwd
    key: "{{ surfshark_user }}"

- name: Install container runtime and prerequisites
  ansible.builtin.import_tasks: dependencies.yml

- name: Render the compose project
  ansible.builtin.import_tasks: install.yml

- name: Bring the VPN gateway up
  ansible.builtin.import_tasks: bootstrap.yml
