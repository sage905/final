---
- name: Assert OpenVPN credentials are supplied
  ansible.builtin.assert:
    that:
      - surfshark_openvpn_user | length > 0
      - surfshark_openvpn_password | length > 0
    fail_msg: >-
      surfshark_vpn_type is 'openvpn' but surfshark_openvpn_user /
      surfshark_openvpn_password are not set. Put your Surfshark *service*
      credentials (dashboard → Manual setup) in inventory, ideally vaulted.
  when: surfshark_vpn_type == 'openvpn'
  no_log: true

- name: Assert WireGuard parameters are supplied
  ansible.builtin.assert:
    that:
      - surfshark_wireguard_private_key | length > 0
      - surfshark_wireguard_addresses | length > 0
    fail_msg: >-
      surfshark_vpn_type is 'wireguard' but surfshark_wireguard_private_key /
      surfshark_wireguard_addresses are not set.
  when: surfshark_vpn_type == 'wireguard'
  no_log: true

- name: Ensure surfshark group exists
  ansible.builtin.group:
    name: "{{ surfshark_group }}"
    state: present

- name: Add admin users to the surfshark group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ surfshark_group }}"
    append: true
  loop: "{{ surfshark_group_members }}"
  when: surfshark_group_members | length > 0

- name: Create the surfshark directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ surfshark_user }}"
    group: "{{ surfshark_group }}"
    mode: "2775"
  loop:
    - "{{ surfshark_data_dir }}"
    - "{{ surfshark_data_dir }}/config"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ surfshark_data_dir }}/docker-compose.yml"
    owner: "{{ surfshark_user }}"
    group: "{{ surfshark_group }}"
    mode: "0660"
  notify: Recreate surfshark stack
