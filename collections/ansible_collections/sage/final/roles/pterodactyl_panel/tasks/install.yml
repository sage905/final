---
- name: Ensure pterodactyl group exists
  ansible.builtin.group:
    name: "{{ pterodactyl_panel_group }}"
    state: present

- name: Add admin users to the pterodactyl group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ pterodactyl_panel_group }}"
    append: true
  loop: "{{ pterodactyl_panel_group_members }}"
  when: pterodactyl_panel_group_members | length > 0

# Top-level dir is Ansible-managed (compose, .env at root).
- name: Create the pterodactyl top-level directory
  ansible.builtin.file:
    path: "{{ pterodactyl_panel_data_dir }}"
    state: directory
    owner: "{{ pterodactyl_panel_user }}"
    group: "{{ pterodactyl_panel_group }}"
    mode: "2775"

# Secrets dir is tighter — group-readable but not group-writable.
- name: Create the secrets directory
  ansible.builtin.file:
    path: "{{ pterodactyl_panel_data_dir }}/secrets"
    state: directory
    owner: "{{ pterodactyl_panel_user }}"
    group: "{{ pterodactyl_panel_group }}"
    mode: "0750"

# Container-managed runtime subtrees. Created ONLY if missing — once they
# exist, the panel/mariadb entrypoints take ownership (www-data for the
# panel, mysql for the database). The setgid bit on initial creation
# means container-written files inherit the pterodactyl group, so admins
# can read via SFTP without sudo.
- name: Stat pterodactyl runtime subdirs
  ansible.builtin.stat:
    path: "{{ pterodactyl_panel_data_dir }}/{{ item }}"
  loop:
    - var
    - nginx
    - logs
    - database
  register: pterodactyl_panel_subdir_stat

- name: Create pterodactyl runtime subdirs (first run only)
  ansible.builtin.file:
    path: "{{ pterodactyl_panel_data_dir }}/{{ item.item }}"
    state: directory
    owner: "{{ pterodactyl_panel_user }}"
    group: "{{ pterodactyl_panel_group }}"
    mode: "2775"
  loop: "{{ pterodactyl_panel_subdir_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Generate persistent secrets when not supplied
  ansible.builtin.include_tasks: _generate_secret.yml
  loop:
    - name: app_key
      override: ""
      prefix: "base64:"
      length: 32
    - name: db_password
      override: "{{ pterodactyl_panel_db_password }}"
      prefix: ""
      length: 24
    - name: db_root_password
      override: "{{ pterodactyl_panel_db_root_password }}"
      prefix: ""
      length: 24
  loop_control:
    loop_var: secret

# Secrets live on the target host (not the controller), so use `slurp` to
# read them — `lookup('ansible.builtin.file', ...)` would look on the
# controller's filesystem and fail.
- name: Slurp generated secrets from the host
  ansible.builtin.slurp:
    src: "{{ pterodactyl_panel_data_dir }}/secrets/{{ item }}"
  loop:
    - app_key
    - db_password
    - db_root_password
  register: pterodactyl_panel_secret_slurp
  no_log: true

- name: Resolve effective secrets
  ansible.builtin.set_fact:
    pterodactyl_panel_effective_app_key: "{{ pterodactyl_panel_secret_slurp.results[0].content | b64decode | trim }}"
    pterodactyl_panel_effective_db_password: "{{ pterodactyl_panel_db_password
                                                 if pterodactyl_panel_db_password | length > 0
                                                 else pterodactyl_panel_secret_slurp.results[1].content | b64decode | trim }}"
    pterodactyl_panel_effective_db_root_password: "{{ pterodactyl_panel_db_root_password
                                                      if pterodactyl_panel_db_root_password | length > 0
                                                      else pterodactyl_panel_secret_slurp.results[2].content | b64decode | trim }}"
  no_log: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pterodactyl_panel_data_dir }}/docker-compose.yml"
    owner: "{{ pterodactyl_panel_user }}"
    group: "{{ pterodactyl_panel_group }}"
    mode: "0660"
  notify: Recreate pterodactyl stack

- name: Render panel environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ pterodactyl_panel_data_dir }}/.env"
    owner: "{{ pterodactyl_panel_user }}"
    group: "{{ pterodactyl_panel_group }}"
    mode: "0660"
  notify: Recreate pterodactyl stack
