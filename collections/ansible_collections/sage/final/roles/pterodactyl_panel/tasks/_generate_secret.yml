---
# Generate-once secret helper. Called per-item from install.yml with:
#   secret.name     — filename under {{ pterodactyl_panel_data_dir }}/secrets/
#   secret.override — caller-supplied value; if non-empty, skip generation
#   secret.prefix   — string to prepend (e.g. "base64:" for Laravel APP_KEY)
#   secret.length   — random byte length passed to `openssl rand -base64`
- name: "Check whether secret {{ secret.name }} already exists"
  ansible.builtin.stat:
    path: "{{ pterodactyl_panel_data_dir }}/secrets/{{ secret.name }}"
  register: pterodactyl_panel_secret_stat

- name: "Generate secret {{ secret.name }}"
  when:
    - not pterodactyl_panel_secret_stat.stat.exists
    - secret.override | length == 0
  block:
    - name: "Generate {{ secret.length }} random bytes for {{ secret.name }}"
      ansible.builtin.command:
        cmd: "openssl rand -base64 {{ secret.length }}"
      register: pterodactyl_panel_secret_value
      changed_when: true

    - name: "Persist secret {{ secret.name }}"
      ansible.builtin.copy:
        content: "{{ secret.prefix }}{{ pterodactyl_panel_secret_value.stdout }}\n"
        dest: "{{ pterodactyl_panel_data_dir }}/secrets/{{ secret.name }}"
        owner: "{{ pterodactyl_panel_user }}"
        group: "{{ pterodactyl_panel_user }}"
        mode: "0600"
      no_log: true
