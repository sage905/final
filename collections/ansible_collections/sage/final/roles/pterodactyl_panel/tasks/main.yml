---
- name: Validate role arguments
  ansible.builtin.validate_argument_spec:
    argument_spec: >-
      {{ (lookup('ansible.builtin.file',
                 role_path ~ '/meta/argument_specs.yml')
          | from_yaml)['argument_specs']['main']['options'] }}

- name: "Look up the {{ pterodactyl_panel_user }} UID"
  ansible.builtin.getent:
    database: passwd
    key: "{{ pterodactyl_panel_user }}"

- name: Install container runtime and prerequisites
  ansible.builtin.import_tasks: dependencies.yml

- name: Render compose project and generate secrets
  ansible.builtin.import_tasks: install.yml

- name: Bring the stack up and bootstrap the panel
  ansible.builtin.import_tasks: bootstrap.yml
