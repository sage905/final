---
- name: Recreate pterodactyl stack
  community.docker.docker_compose_v2:
    project_src: "{{ ptero_data_dir }}"
    state: present
    recreate: always

- name: Reload caddy
  community.docker.docker_container_exec:
    container: pterodactyl-caddy
    command: caddy reload --config /etc/caddy/Caddyfile
  failed_when: false
