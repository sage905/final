---
argument_specs:
  main:
    short_description: Deploy the Pterodactyl Panel as a Docker Compose stack.
    options:
      ptero_data_dir:
        type: path
        default: /srv/pterodactyl
        description: Host directory holding compose project, secrets, and volumes.
      ptero_panel_image:
        type: str
        default: ghcr.io/pterodactyl/panel:latest
      ptero_panel_fqdn:
        type: str
        required: true
        description: Public hostname that Caddy will obtain a certificate for.
      ptero_admin_email:
        type: str
        required: true
        description: ACME registration address and default panel service author.
      ptero_timezone:
        type: str
        default: UTC
      ptero_db_image:
        type: str
        default: mariadb:10.11
      ptero_db_name:
        type: str
        default: panel
      ptero_db_user:
        type: str
        default: pterodactyl
      ptero_db_password:
        type: str
        default: ""
        no_log: true
        description: Override the auto-generated DB password.
      ptero_db_root_password:
        type: str
        default: ""
        no_log: true
      ptero_cache_image:
        type: str
        default: redis:7-alpine
      ptero_caddy_image:
        type: str
        default: caddy:2-alpine
      ptero_mail_driver:
        type: str
        default: log
        choices: [log, smtp, mail, mailgun, ses]
      ptero_mail_host:
        type: str
        default: ""
      ptero_mail_port:
        type: int
        default: 587
      ptero_mail_username:
        type: str
        default: ""
      ptero_mail_password:
        type: str
        default: ""
        no_log: true
      ptero_mail_encryption:
        type: str
        default: tls
        choices: [tls, ssl, ""]
      ptero_mail_from:
        type: str
        default: ""
      ptero_admin_username:
        type: str
        default: ""
        description: Create this admin user on first boot when set with a password.
      ptero_admin_password:
        type: str
        default: ""
        no_log: true
      ptero_admin_first_name:
        type: str
        default: Panel
      ptero_admin_last_name:
        type: str
        default: Admin
      ptero_install_docker:
        type: bool
        default: true
