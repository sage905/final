---
argument_specs:
  main:
    short_description: Deploy the Pterodactyl Panel as a backend behind shared Caddy.
    options:
      pterodactyl_panel_data_dir:
        type: path
        default: /srv/pterodactyl
        description: Host directory holding compose project, secrets, and volumes.
      pterodactyl_panel_fqdn:
        type: str
        required: true
        description: Hostname Caddy obtains a certificate for and serves the panel on.
      pterodactyl_panel_wings_fqdn:
        type: str
        default: ""
        description: Hostname Caddy serves the Wings UI on. Leave empty to skip the wings vhost.
      pterodactyl_panel_wings_backend:
        type: str
        default: "http://host.containers.internal:8080"
        description: Upstream URL Caddy proxies the wings vhost to.
      pterodactyl_panel_image:
        type: str
        default: ghcr.io/blueprintframework/blueprint:latest
        description: Panel image. Default bundles Pterodactyl + Blueprint Framework.
      pterodactyl_panel_admin_email:
        type: str
        required: true
        description: Default panel service author email.
      pterodactyl_panel_timezone:
        type: str
        default: UTC
      pterodactyl_panel_db_image:
        type: str
        default: docker.io/library/mariadb:10.11
      pterodactyl_panel_db_name:
        type: str
        default: panel
      pterodactyl_panel_db_user:
        type: str
        default: pterodactyl
      pterodactyl_panel_db_password:
        type: str
        default: ""
        no_log: true
        description: Override the auto-generated DB password.
      pterodactyl_panel_db_root_password:
        type: str
        default: ""
        no_log: true
      pterodactyl_panel_cache_image:
        type: str
        default: docker.io/library/redis:7-alpine
      pterodactyl_panel_caddy_conf_d_dir:
        type: path
        default: /srv/caddy/conf.d
      pterodactyl_panel_caddy_container:
        type: str
        default: caddy
      pterodactyl_panel_shared_network:
        type: str
        default: web
      pterodactyl_panel_mail_driver:
        type: str
        default: log
        choices: [log, smtp, mail, mailgun, ses]
      pterodactyl_panel_mail_host:
        type: str
        default: ""
      pterodactyl_panel_mail_port:
        type: int
        default: 587
      pterodactyl_panel_mail_username:
        type: str
        default: ""
      pterodactyl_panel_mail_password:
        type: str
        default: ""
        no_log: true
      pterodactyl_panel_mail_encryption:
        type: str
        default: tls
        choices: [tls, ssl, ""]
      pterodactyl_panel_mail_from:
        type: str
        default: ""
      pterodactyl_panel_admin_username:
        type: str
        default: ""
        description: Create this admin user on first boot when set with a password.
      pterodactyl_panel_admin_password:
        type: str
        default: ""
        no_log: true
      pterodactyl_panel_admin_first_name:
        type: str
        default: Panel
      pterodactyl_panel_admin_last_name:
        type: str
        default: Admin
      pterodactyl_panel_install_podman:
        type: bool
        default: true
      pterodactyl_panel_user:
        type: str
        default: containers
