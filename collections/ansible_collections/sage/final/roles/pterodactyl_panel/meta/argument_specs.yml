---
argument_specs:
  main:
    short_description: Deploy the Pterodactyl Panel as a backend behind shared Caddy.
    options:
      pterodactyl_panel_data_dir:
        type: path
        default: /srv/pterodactyl
        description: Host directory holding compose project, secrets, and volumes.
      pterodactyl_panel_fqdn:
        type: str
        required: true
        description: Hostname the panel serves on. Baked into APP_URL.
      pterodactyl_panel_image:
        type: str
        default: ghcr.io/blueprintframework/blueprint:latest
        description: Panel image. Default bundles Pterodactyl + Blueprint Framework.
      pterodactyl_panel_admin_email:
        type: str
        required: true
        description: Default panel service author email.
      pterodactyl_panel_timezone:
        type: str
        default: UTC
      pterodactyl_panel_db_image:
        type: str
        default: docker.io/library/mariadb:10.11
      pterodactyl_panel_db_name:
        type: str
        default: panel
      pterodactyl_panel_db_user:
        type: str
        default: pterodactyl
      # Vault-prone fields (db_password, db_root_password, mail_password,
      # admin_password) are intentionally NOT in this spec — see the
      # validate_argument_spec / AnsibleVaultEncryptedUnicode note in
      # other role argument_specs. All default to "" in defaults/main.yml:
      # DB passwords auto-generate on the target host when blank, and
      # the admin user / mail driver are skipped when their secrets
      # are empty.
      pterodactyl_panel_cache_image:
        type: str
        default: docker.io/library/redis:7-alpine
      pterodactyl_panel_shared_network:
        type: str
        default: web
      pterodactyl_panel_mail_driver:
        type: str
        default: log
        choices: [log, smtp, mail, mailgun, ses]
      pterodactyl_panel_mail_host:
        type: str
        default: ""
      pterodactyl_panel_mail_port:
        type: int
        default: 587
      pterodactyl_panel_mail_username:
        type: str
        default: ""
      pterodactyl_panel_mail_encryption:
        type: str
        default: tls
        choices: [tls, ssl, ""]
      pterodactyl_panel_mail_from:
        type: str
        default: ""
      pterodactyl_panel_admin_username:
        type: str
        default: ""
        description: Create this admin user on first boot when set with a password.
      pterodactyl_panel_admin_first_name:
        type: str
        default: Panel
      pterodactyl_panel_admin_last_name:
        type: str
        default: Admin
      pterodactyl_panel_install_docker:
        type: bool
        default: false
      pterodactyl_panel_user:
        type: str
        default: containers
      pterodactyl_panel_group:
        type: str
        default: pterodactyl
      pterodactyl_panel_group_members:
        type: list
        elements: str
        default: []
        description: >-
          Additional system users to add to pterodactyl_panel_group.
          pterodactyl_panel_user is always a member. Listed users must
          already exist on the host.
