---
# --- Stack location -----------------------------------------------------------
# Root directory on the host that holds the compose project, generated secrets,
# bind-mounted container volumes, and Caddy state.
pterodactyl_panel_data_dir: /srv/pterodactyl

# --- Domain ------------------------------------------------------------------
# Hostname the panel serves on. The role bakes this into the panel's
# APP_URL; the matching Caddy site block lives in caddy_sites in inventory.
pterodactyl_panel_fqdn: ""

# --- Panel ---------------------------------------------------------------------
# Default image bundles Pterodactyl Panel + Blueprint Framework, maintained by
# the Blueprint authors. Tags track upstream panel versions (e.g. v1.11.7);
# pin to a specific tag for reproducibility. To run vanilla Pterodactyl
# without Blueprint, override with ghcr.io/pterodactyl/panel:latest.
pterodactyl_panel_image: ghcr.io/blueprintframework/blueprint:latest

# Email passed to Caddy for ACME account registration and to the panel as the
# default service author.
pterodactyl_panel_admin_email: admin@example.com

pterodactyl_panel_timezone: UTC

# --- Database ------------------------------------------------------------------
# 11.4+ auto-generates self-signed TLS certs and enables SSL by default,
# which is required by the strict mariadb-client bundled in the panel image.
pterodactyl_panel_db_image: docker.io/library/mariadb:11.4
pterodactyl_panel_db_name: panel
pterodactyl_panel_db_user: pterodactyl
# Leave empty to auto-generate and persist under {{ pterodactyl_panel_data_dir }}/secrets/.
pterodactyl_panel_db_password: ""
pterodactyl_panel_db_root_password: ""

# --- Cache ---------------------------------------------------------------------
pterodactyl_panel_cache_image: docker.io/library/redis:7-alpine

# --- Shared network (provided by sage.final.caddy) ----------------------------
pterodactyl_panel_shared_network: web

# --- Mail ----------------------------------------------------------------------
# Panel sends password-reset and account-creation mail. Defaults to the
# in-container `mail` driver, which writes to a log file rather than sending.
pterodactyl_panel_mail_driver: log
pterodactyl_panel_mail_host: ""
pterodactyl_panel_mail_port: 587
pterodactyl_panel_mail_username: ""
pterodactyl_panel_mail_password: ""
pterodactyl_panel_mail_encryption: tls
pterodactyl_panel_mail_from: "{{ pterodactyl_panel_admin_email }}"

# --- Bootstrap admin user ------------------------------------------------------
# When username/password are both set, the role creates this user after first
# boot via `php artisan p:user:make`. Leave empty to create users manually.
pterodactyl_panel_admin_username: ""
pterodactyl_panel_admin_password: ""
pterodactyl_panel_admin_first_name: Panel
pterodactyl_panel_admin_last_name: Admin

# --- Container runtime install -------------------------------------------------
# Set to false on hosts where Podman is already managed elsewhere.
pterodactyl_panel_install_podman: true

# Rootless: user that owns this role's data dir and runs podman-compose.
pterodactyl_panel_user: containers

# Group that owns the panel's files. pterodactyl_panel_user is always a
# member; extra names in pterodactyl_panel_group_members are also added
# (must already exist as system users). The secrets dir stays
# group-readable but not group-writable.
pterodactyl_panel_group: pterodactyl
pterodactyl_panel_group_members: []
