---
# --- Stack location -----------------------------------------------------------
# Root directory on the host that holds the compose project, generated secrets,
# bind-mounted container volumes, and Caddy state.
ptero_data_dir: /srv/pterodactyl

# --- Panel ---------------------------------------------------------------------
ptero_panel_image: ghcr.io/pterodactyl/panel:latest

# Public hostname users hit in the browser. Must resolve to this host for
# Caddy's ACME challenge to succeed.
ptero_panel_fqdn: panel.example.com

# Email passed to Caddy for ACME account registration and to the panel as the
# default service author.
ptero_admin_email: admin@example.com

ptero_timezone: UTC

# --- Database ------------------------------------------------------------------
ptero_db_image: mariadb:10.11
ptero_db_name: panel
ptero_db_user: pterodactyl
# Leave empty to auto-generate and persist under {{ ptero_data_dir }}/secrets/.
ptero_db_password: ""
ptero_db_root_password: ""

# --- Cache ---------------------------------------------------------------------
ptero_cache_image: redis:7-alpine

# --- Reverse proxy -------------------------------------------------------------
ptero_caddy_image: caddy:2-alpine

# --- Mail ----------------------------------------------------------------------
# Panel sends password-reset and account-creation mail. Defaults to the
# in-container `mail` driver, which writes to a log file rather than sending.
ptero_mail_driver: log
ptero_mail_host: ""
ptero_mail_port: 587
ptero_mail_username: ""
ptero_mail_password: ""
ptero_mail_encryption: tls
ptero_mail_from: "{{ ptero_admin_email }}"

# --- Bootstrap admin user ------------------------------------------------------
# When username/password are both set, the role creates this user after first
# boot via `php artisan p:user:make`. Leave empty to create users manually.
ptero_admin_username: ""
ptero_admin_password: ""
ptero_admin_first_name: Panel
ptero_admin_last_name: Admin

# --- Docker engine install -----------------------------------------------------
# Set to false on hosts where Docker is already managed elsewhere.
ptero_install_docker: true
