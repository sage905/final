---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  register: hardening_fail2ban_install

- name: Verify fail2ban package is fully configured
  ansible.builtin.command: dpkg-query -W -f='${Status}' fail2ban
  register: hardening_fail2ban_dpkg
  changed_when: false
  failed_when: "'install ok installed' not in hardening_fail2ban_dpkg.stdout"

- name: Write custom fail2ban filters
  ansible.builtin.template:
    src: filter.conf.j2
    dest: "/etc/fail2ban/filter.d/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ hardening_fail2ban_filters }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart fail2ban

- name: Write fail2ban jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban.service
    enabled: true
    state: started
    daemon_reload: true
