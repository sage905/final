---
- name: Create the rootless containers user
  ansible.builtin.user:
    name: "{{ hardening_containers_user }}"
    shell: /usr/sbin/nologin
    home: "/home/{{ hardening_containers_user }}"
    create_home: true
    state: present

# Look up the UID via getent so we don't depend on the user module's
# registered return value, which is empty in check mode when the user
# didn't exist beforehand.
- name: Look up the containers user
  ansible.builtin.getent:
    database: passwd
    key: "{{ hardening_containers_user }}"
    fail_key: false
  check_mode: false

# Linger keeps the user's systemd manager (and any user services + rootless
# containers) running across reboots without an active login session.
- name: Enable systemd linger for {{ hardening_containers_user }}
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ hardening_containers_user }}"
    creates: "/var/lib/systemd/linger/{{ hardening_containers_user }}"
  when: getent_passwd[hardening_containers_user] is not none

# enable-linger doesn't start the manager on the current boot — kick it
# manually so /run/user/<uid> exists for the application roles that follow.
- name: Start the user's systemd manager
  ansible.builtin.systemd:
    name: "user@{{ getent_passwd[hardening_containers_user][1] }}.service"
    state: started
    enabled: true
  when: getent_passwd[hardening_containers_user] is not none

# Portainer (and any other container-management UI) needs the rootless
# podman API socket. Enable the user-mode podman.socket so it's available
# at /run/user/<uid>/podman/podman.sock for bind-mounting into containers.
- name: Enable the user-mode podman.socket for {{ hardening_containers_user }}
  ansible.builtin.systemd:
    name: podman.socket
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ hardening_containers_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[hardening_containers_user][1] }}"
  when: getent_passwd[hardening_containers_user] is not none

# Lets the user bind 80/443 (Caddy) without CAP_NET_BIND_SERVICE on podman.
- name: Lower the unprivileged port-start threshold
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "{{ hardening_containers_unprivileged_port_start }}"
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    state: present
    reload: true
