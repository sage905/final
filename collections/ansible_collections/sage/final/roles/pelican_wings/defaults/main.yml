---
# --- Wings binary -------------------------------------------------------------
# `latest` pulls https://github.com/pelican-dev/wings/releases/latest/download/...
# Pin to a release tag (without the leading "v", e.g. 1.0.0-beta25) for
# reproducible installs.
pelican_wings_version: latest

pelican_wings_binary_path: /usr/local/bin/wings

# Architecture suffix on the Wings release asset names.
pelican_wings_arch_map:
  x86_64: amd64
  aarch64: arm64

# --- Filesystem layout --------------------------------------------------------
# Pelican Wings defaults to /etc/pelican (Pterodactyl Wings used
# /etc/pterodactyl). The config and log dirs are kept separate from the
# Pterodactyl role so a host can be switched between the two without the
# files clashing.
pelican_wings_config_dir: /etc/pelican
pelican_wings_log_dir: /var/log/pelican

# Wings root/data directory — where game-server volumes are stored. Shared
# with sage.final.pterodactyl_wings (both default here) so switching panels
# keeps server files in the same place. The node's config.yml must agree: set
# the "Daemon Server File Directory" (system.data) under this path when
# creating the node in the Panel, e.g. /srv/gameservers/volumes.
# NOTE: this lives under /srv, so it is covered by the sage.final.borg nightly
# backup. Add it to borg_exclude_patterns if game-server data is large and you
# don't want it backed up.
pelican_wings_data_dir: /srv/gameservers

# Where Wings stores server backups (local backup driver). Under /srv/bulk,
# which sage.final.borg EXCLUDES from the offsite backup — game-server
# backups are already backups, no need to re-upload them. The node's
# config.yml system.backup_directory must point here to take effect.
pelican_wings_backup_dir: /srv/bulk/gamebackups

# Group that owns Wings's config and log files (the data dir stays
# root-only — directly editing game-server state would corrupt running
# servers). Members listed below can read config.yml and tail logs
# without sudo. Users must already exist on the host.
pelican_wings_group: pelican_wings
pelican_wings_group_members: []

# System user Wings runs game-server processes as — must match
# `system.username` in config.yml (Pelican's default is "pelican"). Wings
# tries to create this user on first start and fails with "exit status 9" if
# the name is already taken (e.g. by the `pelican` GROUP that
# sage.final.pelican_panel creates on a combined panel+wings host). The role
# pre-creates it (idempotent) so Wings finds it and skips its own creation.
pelican_wings_system_user: pelican

# Optional: drop a Wings config.yml fetched from the Pelican Panel onto the
# host. Provide the file contents (typically read with `lookup('file', ...)`)
# — when empty the role installs the binary and unit but leaves config.yml to
# the operator (paste from the Panel UI: Admin → Nodes → Configuration).
pelican_wings_config_yaml: ""

# --- System tuning ------------------------------------------------------------
# Wings needs cgroup swap accounting to enforce per-container memory+swap
# limits. Adds `swapaccount=1` to GRUB_CMDLINE_LINUX_DEFAULT. Requires a reboot
# to take effect.
pelican_wings_enable_swap_accounting: true

# --- Container runtime install ------------------------------------------------
# Set to false on hosts where Podman is already managed elsewhere. Wings is
# pointed at Podman's Docker-compatible socket via DOCKER_HOST in the unit.
# Upstream Pelican Wings targets Docker; this works because podman.socket
# emulates the Docker API, but treat as best-effort.
pelican_wings_install_podman: true
