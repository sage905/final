---
- name: Ensure pelican_wings group exists
  ansible.builtin.group:
    name: "{{ pelican_wings_group }}"
    state: present

# Wings runs game-server processes as this system user and creates it on
# first start — which fails with "exit status 9" when the name already
# exists (e.g. the `pelican` group from sage.final.pelican_panel). Pre-create
# it here, idempotently, so Wings finds it and skips its own creation. If a
# group of this name already exists it is reused (no GID change).
- name: Ensure the Wings system group exists
  ansible.builtin.group:
    name: "{{ pelican_wings_system_user }}"
    system: true
    state: present

- name: Ensure the Wings system user exists
  ansible.builtin.user:
    name: "{{ pelican_wings_system_user }}"
    group: "{{ pelican_wings_system_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Add users to the pelican_wings group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ pelican_wings_group }}"
    append: true
  loop: "{{ pelican_wings_group_members }}"
  when: pelican_wings_group_members | length > 0

# Wings runs as a root system daemon. Group members can read config and
# logs (inspect + tail) but the data dir stays root-only — directly
# editing game-server state from outside Wings risks corrupting running
# servers. Admins should manage servers via the Panel UI / Wings API.
- name: Create Wings config and log directories (group readable)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ pelican_wings_group }}"
    mode: "0750"
  loop:
    - "{{ pelican_wings_config_dir }}"
    - "{{ pelican_wings_log_dir }}"

- name: Create Wings data and backup directories (root-only)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ pelican_wings_data_dir }}"
    - "{{ pelican_wings_backup_dir }}"

- name: Resolve Wings download URL
  ansible.builtin.set_fact:
    pelican_wings_download_url: >-
      {%- set arch = pelican_wings_arch_map[ansible_facts['architecture']] -%}
      {%- if pelican_wings_version == 'latest' -%}
      https://github.com/pelican-dev/wings/releases/latest/download/wings_linux_{{ arch }}
      {%- else -%}
      https://github.com/pelican-dev/wings/releases/download/v{{ pelican_wings_version }}/wings_linux_{{ arch }}
      {%- endif -%}

- name: Download the Wings binary
  ansible.builtin.get_url:
    url: "{{ pelican_wings_download_url }}"
    dest: "{{ pelican_wings_binary_path }}"
    owner: root
    group: root
    mode: "0755"
    force: "{{ pelican_wings_version != 'latest' }}"
  notify: Restart wings

- name: Install the Wings systemd unit
  ansible.builtin.template:
    src: wings.service.j2
    dest: /etc/systemd/system/wings.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart wings
