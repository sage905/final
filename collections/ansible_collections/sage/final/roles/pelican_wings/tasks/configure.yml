---
- name: Write Wings config.yml from supplied content
  ansible.builtin.copy:
    content: "{{ pelican_wings_config_yaml }}"
    dest: "{{ pelican_wings_config_dir }}/config.yml"
    owner: root
    group: "{{ pelican_wings_group }}"
    mode: "0640"
  when: pelican_wings_config_yaml | length > 0
  notify: Restart wings

- name: Detect whether Wings config.yml is present
  ansible.builtin.stat:
    path: "{{ pelican_wings_config_dir }}/config.yml"
  register: pelican_wings_config_stat

- name: Enable and start Wings
  ansible.builtin.systemd:
    name: wings
    enabled: true
    state: started
    daemon_reload: true
  when: pelican_wings_config_stat.stat.exists

- name: Enable Wings (config not yet present — service will start on next run)
  ansible.builtin.systemd:
    name: wings
    enabled: true
    state: stopped
    daemon_reload: true
  when: not pelican_wings_config_stat.stat.exists

- name: Remind operator to register this node with the Panel
  ansible.builtin.debug:
    msg: >-
      Wings is installed but {{ pelican_wings_config_dir }}/config.yml is missing.
      Register this node in the Pelican Panel UI (Admin → Nodes → Create), open
      its Configuration tab, and copy the generated config.yml to
      {{ pelican_wings_config_dir }}/config.yml, then `systemctl start wings`.
  when: not pelican_wings_config_stat.stat.exists
