---
- name: Assert that the target host is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: >-
      sage.final.pelican_wings currently supports Ubuntu only. Detected
      distribution: {{ ansible_facts['distribution'] | default('unknown') }}.

- name: Install the Docker engine and Compose plugin
  ansible.builtin.include_role:
    name: sage.final.docker
  when: pelican_wings_install_docker

- name: Enable cgroup swap accounting in GRUB
  when: pelican_wings_enable_swap_accounting
  block:
    - name: Ensure swapaccount=1 is set on GRUB_CMDLINE_LINUX_DEFAULT
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?:(?!swapaccount=1).)*)"$'
        replace: '\1 swapaccount=1"'
      register: pelican_wings_grub_change

    - name: Rebuild GRUB config
      ansible.builtin.command:
        cmd: update-grub
      when: pelican_wings_grub_change.changed
      changed_when: true

    - name: Warn if a reboot is required to activate swap accounting
      ansible.builtin.debug:
        msg: >-
          GRUB updated to enable swapaccount=1. Reboot this host so Wings can
          enforce per-container memory+swap limits.
      when: pelican_wings_grub_change.changed
