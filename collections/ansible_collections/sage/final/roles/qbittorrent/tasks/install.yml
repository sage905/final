---
- name: Ensure qbittorrent group exists
  ansible.builtin.group:
    name: "{{ qbittorrent_group }}"
    state: present

- name: Add admin users to the qbittorrent group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ qbittorrent_group }}"
    append: true
  loop: "{{ qbittorrent_group_members }}"
  when: qbittorrent_group_members | length > 0

# Top-level dir holds the compose file (host-owned). /config is created and
# owned by the linuxserver PUID:PGID so the image can write through the mount.
- name: Create the qbittorrent top-level directory
  ansible.builtin.file:
    path: "{{ qbittorrent_data_dir }}"
    state: directory
    owner: "{{ qbittorrent_user }}"
    group: "{{ qbittorrent_group }}"
    mode: "2775"

- name: Create the qbittorrent config directory (owned by the container user)
  ansible.builtin.file:
    path: "{{ qbittorrent_data_dir }}/config"
    state: directory
    owner: "{{ qbittorrent_puid }}"
    group: "{{ qbittorrent_pgid }}"
    mode: "0775"

# The downloads tree (qbittorrent_downloads_path) is owned by sage.final.disk_pool
# — the single source of truth for the shared media tree — so this role does not
# create or chown it. It must match the *arr apps' downloads path for hardlinks.

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ qbittorrent_data_dir }}/docker-compose.yml"
    owner: "{{ qbittorrent_user }}"
    group: "{{ qbittorrent_group }}"
    mode: "0660"
  notify: Recreate qbittorrent stack
