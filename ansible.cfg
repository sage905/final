[defaults]
# Specify the inventory file
inventory = inventory/hosts.yml

# Define the directory for host and group variables
host_vars_inventory = inventory/host_vars
group_vars_inventory = inventory/group_vars

# Standalone roles installed from requirements.yml (e.g. geerlingguy.docker)
# land here; the collection's sage.final.docker role includes them by name.
roles_path = roles

# Set the logging verbosity level
verbosity = 2

# Set the default user for SSH connections
remote_user = myuser

# Define the default become method
become_method = sudo

# --- Speedups -----------------------------------------------------------------
# Parallel host fan-out (single-host plays ignore this, but cheap).
forks = 20

# Skip gather_facts when cached results are still fresh (paired with fact_caching below).
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.cache/ansible_facts
fact_caching_timeout = 86400

# Suppress the "discovered interpreter_python" warning on every play.
interpreter_python = auto_silent

# Human-friendlier output (no speedup, but cheap to enable here).
callback_result_format = yaml

# Execute modules over the live SSH session instead of scp'ing a temp file first.
# Requires sudoers `requiretty` to be off — true by default on modern Ubuntu.
# (In Ansible core 2.18+ this moved out of [ssh_connection] into [defaults].)
pipelining = True

[ssh_connection]
# Reuse one SSH connection per host across tasks; multi-task runs go from
# multiple-handshakes-per-task to one handshake total.
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o PreferredAuthentications=publickey

[persistent_connection]
# Controls how long the persistent connection will remain idle before it is destroyed
connect_timeout=30

# Controls the amount of time to wait for response from remote device before timing out persistent connection
command_timeout=30
