---
# Top-level orchestrator. Run all plays with:
#   ansible-navigator run site.yml --eei ee-demo -i inventory/hosts.yml
# Or limit to one:
#   ansible-navigator run site.yml --tags cockpit
#   ansible-navigator run site.yml --tags caddy
#   ansible-navigator run site.yml --tags pterodactyl
#   ansible-navigator run site.yml --tags pelican
#   ansible-navigator run site.yml --tags wings
#   ansible-navigator run site.yml --tags pelican_wings
#   ansible-navigator run site.yml --tags mysql
#   ansible-navigator run site.yml --tags surfshark
#   ansible-navigator run site.yml --tags sonarr
#   ansible-navigator run site.yml --tags radarr
#   ansible-navigator run site.yml --tags seerr
#   ansible-navigator run site.yml --tags wordpress
#   ansible-navigator run site.yml --tags dashy
#   ansible-navigator run site.yml --tags glance
#   ansible-navigator run site.yml --tags bracket
#   ansible-navigator run site.yml --tags jellyfin
#   ansible-navigator run site.yml --tags portainer
#   ansible-navigator run site.yml --tags healthchecks
#   ansible-navigator run site.yml --tags borg
#   ansible-navigator run site.yml --tags hardening
#   ansible-navigator run site.yml --tags wireguard_client
# Skip the apt upgrade with --skip-tags update.
#
# Container runtime: this collection runs all stacks on rootful Docker (engine
# installed by sage.final.docker, wrapping geerlingguy.docker). Migrating a host
# that still runs Podman? Use migrate_podman_to_docker.yml — see
# docs/Podman-to-Docker-Migration.md.
- name: Bring all packages up to date
  hosts: all
  become: true
  gather_facts: true
  tags:
    - update
  tasks:
    - name: Update apt cache and dist-upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

- name: Harden the host
  hosts: all
  become: true
  gather_facts: true
  tags:
    - hardening
  roles:
    - role: sage.final.hardening

- name: Configure WireGuard client tunnels
  hosts: wireguard_clients
  become: true
  gather_facts: true
  tags:
    - wireguard_client
  roles:
    - role: sage.final.wireguard_client

# Install the Docker engine once per host, up front, so the application plays
# below don't each re-run the install. Container roles default
# <role>_install_docker: false and rely on this play; flip a role's flag to
# true only when running it standalone (outside site.yml).
- name: Install the Docker engine on all container hosts
  hosts:
    - caddy
    - dashy
    - glance
    - bracket
    - jellyfin
    - healthchecks
    - portainer
    - pelican_panel
    - pterodactyl_panel
    - mysql
    - surfshark
    - sonarr
    - radarr
    - seerr
    - wordpress
    - pelican_wings
    - pterodactyl_wings
  become: true
  gather_facts: true
  tags:
    - docker
  roles:
    - role: sage.final.docker

- name: Install Cockpit
  hosts: coserver
  become: true
  gather_facts: true
  tags:
    - cockpit
  roles:
    - role: sage.final.cockpit

- name: Deploy Caddy
  hosts: caddy
  become: true
  gather_facts: true
  tags:
    - caddy
  roles:
    - role: sage.final.caddy

- name: Deploy Pterodactyl Panel
  hosts: pterodactyl_panel
  become: true
  gather_facts: true
  tags:
    - pterodactyl
  roles:
    - role: sage.final.pterodactyl_panel

- name: Deploy Pterodactyl Wings
  hosts: pterodactyl_wings
  become: true
  gather_facts: true
  tags:
    - wings
  roles:
    - role: sage.final.pterodactyl_wings

# Alternative to the Pterodactyl Panel play above. Dormant until a host is
# placed in the `pelican_panel` group; do not run both panels on one host.
- name: Deploy Pelican Panel
  hosts: pelican_panel
  become: true
  gather_facts: true
  tags:
    - pelican
  roles:
    - role: sage.final.pelican_panel

# Pelican's fork of Wings — the alternative to the Pterodactyl Wings play.
# Dormant until a host is placed in the `pelican_wings` group. Shares the
# `wings` binary path and service name with pterodactyl_wings, so a host
# runs one or the other, never both.
- name: Deploy Pelican Wings
  hosts: pelican_wings
  become: true
  gather_facts: true
  tags:
    - pelican_wings
  roles:
    - role: sage.final.pelican_wings

# Dedicated MariaDB (MySQL) database host the panel points at to provision a
# database per game server, with Adminer as the web management UI. Dormant
# until a host is placed in the `mysql` group.
- name: Deploy the panel database host
  hosts: mysql
  become: true
  gather_facts: true
  tags:
    - mysql
  roles:
    - role: sage.final.mysql

# Surfshark VPN gateway (gluetun) + the *arr apps that route through it. Order
# matters: the VPN container must be up before Sonarr/Radarr, which join its
# network namespace (network_mode "container:surfshark") and have no internet
# path except the tunnel. Dormant until hosts are placed in these groups.
- name: Deploy the Surfshark VPN gateway
  hosts: surfshark
  become: true
  gather_facts: true
  tags:
    - surfshark
  roles:
    - role: sage.final.surfshark

- name: Deploy Sonarr (behind the VPN)
  hosts: sonarr
  become: true
  gather_facts: true
  tags:
    - sonarr
  roles:
    - role: sage.final.sonarr

- name: Deploy Radarr (behind the VPN)
  hosts: radarr
  become: true
  gather_facts: true
  tags:
    - radarr
  roles:
    - role: sage.final.radarr

# Seerr — the request/discovery frontend for the media stack. Runs on the shared
# network by default (it's a frontend, not a downloader); set seerr_vpn_container
# to route it through the VPN too. Dormant until a host is in the `seerr` group.
- name: Deploy Seerr (media request frontend)
  hosts: seerr
  become: true
  gather_facts: true
  tags:
    - seerr
  roles:
    - role: sage.final.seerr

- name: Deploy WordPress
  hosts: wordpress
  become: true
  gather_facts: true
  tags:
    - wordpress
  roles:
    - role: sage.final.wordpress

- name: Deploy Dashy
  hosts: dashy
  become: true
  gather_facts: true
  tags:
    - dashy
  roles:
    - role: sage.final.dashy

- name: Deploy Glance
  hosts: glance
  become: true
  gather_facts: true
  tags:
    - glance
  roles:
    - role: sage.final.glance

- name: Deploy Bracket
  hosts: bracket
  become: true
  gather_facts: true
  tags:
    - bracket
  roles:
    - role: sage.final.bracket

- name: Deploy Jellyfin
  hosts: jellyfin
  become: true
  gather_facts: true
  tags:
    - jellyfin
  roles:
    - role: sage.final.jellyfin

- name: Deploy Portainer
  hosts: portainer
  become: true
  gather_facts: true
  tags:
    - portainer
  roles:
    - role: sage.final.portainer

- name: Deploy Healthchecks
  hosts: healthchecks
  become: true
  gather_facts: true
  tags:
    - healthchecks
  roles:
    - role: sage.final.healthchecks

- name: Schedule Borg backups
  hosts: borg
  become: true
  gather_facts: true
  tags:
    - borg
  roles:
    - role: sage.final.borg
