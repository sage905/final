---
# Top-level orchestrator. Run all plays with:
#   ansible-navigator run site.yml --eei ee-demo -i inventory/hosts.yml
# Or limit to one:
#   ansible-navigator run site.yml --tags cockpit
#   ansible-navigator run site.yml --tags caddy
#   ansible-navigator run site.yml --tags pterodactyl
#   ansible-navigator run site.yml --tags wings
#   ansible-navigator run site.yml --tags wordpress
#   ansible-navigator run site.yml --tags dashy
#   ansible-navigator run site.yml --tags glance
#   ansible-navigator run site.yml --tags bracket
#   ansible-navigator run site.yml --tags jellyfin
#   ansible-navigator run site.yml --tags hardening
# Skip the apt upgrade with --skip-tags update.
- name: Bring all packages up to date
  hosts: all
  become: true
  gather_facts: true
  tags:
    - update
  tasks:
    - name: Update apt cache and dist-upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

- name: Harden the host
  hosts: all
  become: true
  gather_facts: true
  tags:
    - hardening
  roles:
    - role: sage.final.hardening

- name: Install Cockpit
  hosts: coserver
  become: true
  gather_facts: true
  tags:
    - cockpit
  roles:
    - role: sage.final.cockpit

- name: Deploy Caddy
  hosts: caddy
  become: true
  gather_facts: true
  tags:
    - caddy
  roles:
    - role: sage.final.caddy

- name: Deploy Pterodactyl Panel
  hosts: pterodactyl_panel
  become: true
  gather_facts: true
