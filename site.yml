  roles:
    - role: sage.final.pterodactyl_wings

- name: Deploy WordPress
  hosts: wordpress
  become: true
  gather_facts: true
  tags:
    - wordpress
  roles:
    - role: sage.final.wordpress

- name: Deploy Dashy
  hosts: dashy
  become: true
  gather_facts: true
  tags:
    - dashy
  roles:
    - role: sage.final.dashy

- name: Deploy Glance
  hosts: glance
  become: true
  gather_facts: true
  tags:
    - glance
  roles:
    - role: sage.final.glance

- name: Deploy Bracket
  hosts: bracket
  become: true
  gather_facts: true
  tags:
    - bracket
  roles:
    - role: sage.final.bracket

- name: Deploy Jellyfin
  hosts: jellyfin
